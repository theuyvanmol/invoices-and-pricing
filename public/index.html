}
function refreshCmp(){
  document.querySelectorAll('#dLines .line').forEach(el=>{const i=+el.dataset.line;const l=scan.draft.lines[i];if(l){const sum=el.querySelector('.lsum');const tmp=document.createElement('div');tmp.innerHTML=lineSum(l,i);sum.replaceWith(tmp.firstChild);el.classList.toggle('issue',!!(lineIssue(l)&&l.name))}});
  const sm=$('#dSummary');if(sm)sm.innerHTML=summaryHTML(scan.draft.lines,{live:true});
  document.querySelectorAll('#dLines .secfoot').forEach(el=>{const c=el.dataset.cat;const tmp=document.createElement('div');tmp.innerHTML=secFoot(c,scan.draft.lines,true);el.replaceWith(tmp.firstChild)});
  if(false)document.querySelectorAll('#dLines .sechead').forEach(el=>{const c=el.dataset.cat;const t=scan.draft.lines.filter(l=>(l.category||'')===c).reduce((a,l)=>a+lineTotal(l),0);const b=el.querySelector('b.mono');if(b)b.textContent=money(t);const old=el.querySelector('.pill');const tmp=document.createElement('div');tmp.innerHTML=secNote(c);if(old)old.remove();if(tmp.firstChild)el.appendChild(tmp.firstChild)});

  const printed=num(scan.draft.printedTotal),mm=$('#dMismatch');if(mm)mm.innerHTML=printed>0&&Math.abs(printed-draftTotal())>0.05?'<p class="notice" style="margin-top:10px;color:var(--warn)">The lines do not add up to the printed total. VAT, delivery or a missed line can cause this. Check the photo.</p>':'';
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-stab],[data-editprice],[data-acctedit],[data-fixunit],[data-toggleline],[data-drvcheck],[data-drvretry],[data-drvignore],[data-impf],[data-impcheck],[data-impretry],[data-go],[data-product],[data-invoice],[data-supplier],[data-act],[data-pfilter],[data-afilter],[data-review],[data-reopen],[data-rmphoto],[data-rmline],[data-askdel],[data-del]');
  if(!t)return;
  if(t.dataset.stab){UI.stab=t.dataset.stab;render();return}
  if(t.dataset.editprice){const [inv,pid]=t.dataset.editprice.split('|');UI.ep={inv,pid};UI.mp=null;showProduct(pid);setTimeout(()=>$('#epPrice')?.focus(),50);return}
  if(t.dataset.acctedit){UI.acct=(S.accounts||[]).find(u=>u.id===t.dataset.acctedit)||null;render();return}
  if(t.dataset.fixunit){const [inv,pid,q]=t.dataset.fixunit.split('|');const ln=S.inv.find(v=>v.id===inv)?.lines?.find(l=>l.productId===pid);UI.fix={inv,pid,qty:ln?.qty??q,unit:ln?.unit||''};showProduct(pid);setTimeout(()=>$('#fixCount')?.focus(),50);return}
  if(t.dataset.drvcheck){drvCheck(t.dataset.drvcheck);return}
  if(t.dataset.drvretry){try{await api('/api/drive',{method:'POST',body:{action:'retry',fileId:t.dataset.drvretry}});await drvLoad();drvSync(false)}catch(e){toast(e.message)}return}
  if(t.dataset.drvignore){try{await api('/api/drive',{method:'POST',body:{action:'ignore',fileId:t.dataset.drvignore}});drvLoad()}catch(e){toast(e.message)}return}
  if(t.dataset.toggleline!=null){const i=+t.dataset.toggleline,l=scan.draft.lines[i];l._open=!lineOpen(l);const el=document.querySelector(`#dLines .line[data-line="${i}"]`);if(el){const tmp=document.createElement('div');tmp.innerHTML=lineHTML(l,i);el.replaceWith(tmp.firstChild);if(l._open)document.querySelector(`#dLines .line[data-line="${i}"] input[data-lf="price"]`)?.focus()}return}
  if(t.dataset.impf){IMP.filter=t.dataset.impf;render();return}
  if(t.dataset.impcheck){impCheck(t.dataset.impcheck);return}
  if(t.dataset.impretry){const it=IMP.items.find(x=>x.key===t.dataset.impretry);if(it){it.status='waiting';it.msg='';render()}return}
  if(t.dataset.go){closeSheet();if(location.hash==='#'+t.dataset.go)render();else location.hash=t.dataset.go;window.scrollTo({top:0});return}
  if(t.dataset.product){showProduct(t.dataset.product);return}
  if(t.dataset.invoice){showInvoice(t.dataset.invoice);return}
  if(t.dataset.supplier){showSupplier(t.dataset.supplier);return}
  if(t.dataset.pfilter){UI.pfilter=t.dataset.pfilter;render();return}
  if(t.dataset.afilter){UI.afilter=t.dataset.afilter;render();return}
  if(t.dataset.review){if(!isOwner()){toast('Only the owner can review alerts.');return}try{await api('/api/alerts',{method:'PATCH',body:{id:t.dataset.review,status:'reviewed'}});toast('Marked as reviewed.');load()}catch(e){toast(e.message)}return}
  if(t.dataset.reopen){try{await api('/api/alerts',{method:'PATCH',body:{id:t.dataset.reopen,status:'open'}});toast('Alert reopened.');load()}catch(e){toast(e.message)}return}
  if(t.dataset.rmphoto!=null){const p=scan.photos.splice(+t.dataset.rmphoto,1)[0];if(p)URL.revokeObjectURL(p.url);render();return}
  if(t.dataset.rmline!=null){scan.draft.lines.splice(+t.dataset.rmline,1);lastView=null;render();return}
  if(t.dataset.askdel){$('#delWrap').innerHTML=`<div class="banner alert" style="width:100%;margin:0"><div class="grow">Delete this invoice? Its prices and alerts are removed too.</div><button class="btn sm danger" data-del="${esc(t.dataset.askdel)}">Delete</button><button class="btn sm" data-act="close">Keep</button></div>`;return}
  if(t.dataset.del){deleteInvoice(t.dataset.del);return}
  const a=t.dataset.act;
  if(a==='close')closeSheet();
  else if(a==='read')readInvoice();
  else if(a==='cancelRead'){if(readAbort)readAbort.cancelled=true;scan.step='capture';render()}
  else if(a==='manual')startManual();
  else if(a==='manualKeep'){const keep=scan.photos;startManual();scan.photos=keep;lastView=null;render()}
  else if(a==='pasteToggle'){UI.paste=!UI.paste;lastView=null;render();if(UI.paste)setTimeout(()=>$('#pasteText')?.focus(),30)}
  else if(a==='pasteAdd'){const rows=parsePaste($('#pasteText')?.value);if(!rows.length){toast('No product rows found. Each row needs a name and a price.');return}scan.draft.lines=scan.draft.lines.filter(l=>l.name.trim()||num(l.price)).concat(rows.map(r=>({...r,_open:true})));UI.paste=false;lastView=null;render();toast(`${rows.length} line${rows.length>1?'s':''} added. Check them before saving.`)}
  else if(a==='loadSup'){const rows=supplierProductLines(scan.draft.supplierId);const have=new Set(scan.draft.lines.map(l=>norm(l.name)));scan.draft.lines=scan.draft.lines.filter(l=>l.name.trim()).concat(rows.filter(r=>!have.has(norm(r.name))));lastView=null;render();toast('Fill in the quantities. Change any price that is different.')}
  else if(a==='resetScan'){if(scan.importKey||scan.driveFileId){scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';return}scan.photos.forEach(p=>URL.revokeObjectURL(p.url));scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};lastView=null;render()}
  else if(a==='addLine'){scan.draft.lines.push({name:'',unit:'',qty:'1',price:'',_open:true});lastView=null;render();const ins=document.querySelectorAll('#dLines input[data-lf="name"]');ins[ins.length-1]?.focus()}
  else if(a==='save')saveInvoice();
  else if(a==='saveSettings'){try{const r=await api('/api/settings',{method:'PUT',body:{threshold:num($('#setThr').value),restaurant:$('#setRest').value.trim(),alertEmail:$('#setEmail').value.trim()}});S.settings={...S.settings,...r.settings};toast('Settings saved.');render()}catch(e){toast(e.message)}}
  else if(a==='savePins'){const o=$('#newOwnerPin').value.trim(),m=$('#newMgrPin').value.trim();if(!o&&!m){toast('Type a new PIN first.');return}try{await api('/api/session',{method:'POST',body:{action:'pins',ownerPin:o||undefined,managerPin:m||undefined}});S.settings.pinsEnabled=true;toast('PIN sign-in is on. Tell your managers the manager PIN.');render();$('#newOwnerPin').value='';$('#newMgrPin').value=''}catch(e){toast(e.message)}}
  else if(a==='signout')signOut();
  else if(a==='acctSave'){try{await api('/api/session',{method:'POST',body:{action:'account',id:UI.acct?.id,username:$('#acName').value,email:$('#acEmail').value,password:$('#acPass').value,role:$('#acRole').value}});UI.acct=null;const s2=await api('/api/session');S.accounts=s2.accounts||[];S.loginMode=s2.loginMode;toast('Login saved.');render()}catch(e){toast(e.message)}}
  else if(a==='acctCancel'){UI.acct=null;render()}
  else if(a==='acctRemove'){if(!UI.acct)return;try{await api('/api/session',{method:'POST',body:{action:'account',remove:UI.acct.id}});UI.acct=null;const s2=await api('/api/session');S.accounts=s2.accounts||[];S.loginMode=s2.loginMode;toast('Login removed.');render()}catch(e){toast(e.message)}}
  else if(a==='toggleAll'){const all=scan.draft.lines.every(lineOpen);scan.draft.lines.forEach(l=>l._open=!all);lastView=null;render()}
  else if(a==='fixCancel'){const pid=UI.fix?.pid;UI.fix=null;if(pid)showProduct(pid)}
  else if(a==='fixSave'){const f=UI.fix;try{await api('/api/invoices',{method:'PATCH',body:{invoiceId:f.inv,productId:f.pid,count:num($('#fixCount').value),unit:$('#fixUnit').value.trim()}});UI.fix=null;await load();showProduct(f.pid);toast('Pack size fixed. Price is now per item.')}catch(e){toast(e.message)}}
  else if(a==='impStart')impRun();
  else if(a==='drvConnect'){UI.drvLink=$('#drvLink').value.trim();DRV.busy=true;DRV.note='';render();try{const r=await api('/api/drive',{method:'POST',body:{action:'connect',link:UI.drvLink,importExisting:$('#drvExisting')?.checked!==false}});DRV.st=r.status;DRV.busy=false;toast(`Connected. ${r.files} file${r.files===1?'':'s'} found in the folder.`);if(r.files&&$('#drvExisting')?.checked!==false)drvSync(true);else render()}catch(e){DRV.busy=false;DRV.note=e.message;render()}}
  else if(a==='drvSyncAll'){DRV.lastAuto=Date.now();drvSync(true)}
  else if(a==='drvStop'){DRV.stop=true;DRV.note='Pausing after the current invoice…';render()}
  else if(a==='drvDisconnect'){try{await api('/api/drive',{method:'POST',body:{action:'disconnect'}});DRV.st=null;drvLoad();toast('Folder disconnected.')}catch(e){toast(e.message)}}
  else if(a==='impPause'){IMP.stop=true;IMP.note='Pausing after the current invoice…';render()}
  else if(a==='impClear'){IMP.items=[];IMP.note='';render()}
  else if(a==='menu')showMenu();
  else if(a==='reviewAll'){if(!isOwner())return;const ids=openAlerts().map(x=>x.id);t.disabled=true;let n=0;for(const id of ids){try{await api('/api/alerts',{method:'PATCH',body:{id,status:'reviewed'}});n++}catch(e){toast(e.message);break}}toast(`${n} alert${n===1?'':'s'} marked as reviewed.`);load()}
  else if(a==='mpOpen'){UI.mp=t.dataset.pid;UI.ep=null;showProduct(t.dataset.pid);setTimeout(()=>$('#mpPrice')?.focus(),50)}
  else if(a==='mpCancel'||a==='epCancel'){const pid=UI.mp||UI.ep?.pid;UI.mp=null;UI.ep=null;if(pid)showProduct(pid)}
  else if(a==='mpSave'){const p=S.prod.find(x=>x.id===UI.mp);const price=num($('#mpPrice').value),date=$('#mpDate').value||todayISO();if(!p)return;if(!(price>0)){toast('Enter the new price.');return}t.disabled=true;
    try{await api('/api/invoices',{method:'POST',body:{supplierId:p.supplierId,date,number:'',source:'pricelist',manualPrice:true,lines:[{name:p.name,unit:p.unit,qty:1,price}]}});UI.mp=null;await load();showProduct(p.id);toast(`New price saved: ${moneyU(price)} per ${p.unit}.`)}catch(e){t.disabled=false;toast(e.message)}}
  else if(a==='epSave'){const f=UI.ep;const price=num($('#epPrice').value);if(!(price>0)){toast('Enter the correct price.');return}t.disabled=true;
    try{await api('/api/invoices',{method:'PATCH',body:{action:'price',invoiceId:f.inv,productId:f.pid,price}});UI.ep=null;await load();showProduct(f.pid);toast('Price corrected. Totals and alerts updated.')}catch(e){t.disabled=false;toast(e.message)}}
  else if(a==='csv')downloadCsv();
  else if(a==='print')window.print();
  else if(a==='newPricelist'||a==='addTo'){scan.photos.forEach(p=>URL.revokeObjectURL(p.url));scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'manual',kind:'pricelist',supplierId:t.dataset.sup||'new'};lastView=null;if(location.hash==='#scan')render();else location.hash='scan';window.scrollTo({top:0})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('#dLines input')){
    e.preventDefault();
    const line=e.target.closest('.line'),f=e.target.dataset.lf,order=['name','pieces','qty','unit','price'];
    if(f==='price'){const i=+line.dataset.line;if(i===scan.draft.lines.length-1){scan.draft.lines.push({name:'',unit:'',qty:'1',price:'',_open:true});lastView=null;render()}const ins=document.querySelectorAll('#dLines input[data-lf="name"]');ins[i+1]?.focus();return}
    line.querySelector(`[data-lf="${order[order.indexOf(f)+1]}"]`)?.focus();return;
  }
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.matches('tr[data-product]'))showProduct(e.target.dataset.product);
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.photo){addPhotos([...t.files]);t.value='';return}
  if(t.dataset.lf==='qty'&&/[a-z]/i.test(t.value)){const el=t.closest('.line'),i=+el.dataset.line,l=scan.draft.lines[i];const r=parseQty(t.value);if(r.q>0){l.qty=String(r.q);t.value=l.qty;if(r.unit){l.unit=r.unit;const u=el.querySelector('[data-lf="unit"]');if(u)u.value=r.unit}if(num(l.total)>0&&!num(l.price)){l.price=String(Math.round(num(l.total)/r.q*100)/100);const pe=el.querySelector('[data-lf="price"]');if(pe)pe.value=l.price}refreshCmp()}return}
  if(t.dataset.lf==='credit'||t.dataset.lf==='other'){const el=t.closest('.line'),i=+el.dataset.line,l=scan.draft.lines[i];
    if(t.dataset.lf==='credit'){l.credit=t.checked;const v=Math.abs(num(l.price));l.price=v?String(t.checked?-v:v):l.price;if(t.checked)l.other=true}else{l.other=t.checked;if(!t.checked){l.credit=false;if(num(l.price)<0)l.price=String(Math.abs(num(l.price)))}}
    const tmp=document.createElement('div');tmp.innerHTML=lineHTML(l,i);el.replaceWith(tmp.firstChild);refreshCmp();return}
  if(t.dataset.lf==='promo'){const i=+t.closest('.line').dataset.line;scan.draft.lines[i].promo=t.checked;refreshCmp();return}
  if(t.dataset.addpage){const keep={supplierId:scan.draft.supplierId,number:scan.draft.number};await addPhotos([...t.files]);t.value='';const drive=scan.driveFileId,ik=scan.importKey,hist=scan.driveHistoric;await readInvoice();if(scan.step==='review'){scan.driveFileId=drive;scan.importKey=ik;scan.driveHistoric=hist;if(!scan.draft.number)scan.draft.number=keep.number}return}
  if(t.dataset.imp){impAdd(t.files);t.value='';return}
  if(t.id==='psup'){UI.psup=t.value;render()}
  if(t.id==='lsup'){UI.lsup=t.value;render()}
  if(t.id==='psort'){UI.psort=t.value;render()}
  if(t.id==='isup'){UI.isup=t.value;render()}
  if(t.id==='dSup'){scan.draft.supplierId=t.value;lastView=null;render()}
  if(t.dataset&&t.dataset.lf==='name'){fillFromKnown(+t.closest('.line').dataset.line)}
  if(t.id==='dDate'){scan.draft.date=t.value;refreshCmp()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){UI.pq=t.value;render()}
  if(t.id==='lq'){UI.lq=t.value;render()}
  if(t.id==='sq'){UI.sq=t.value;render()}
  if(t.id==='spq'){UI.spq=t.value;render()}
  if(t.id==='drvLink')UI.drvLink=t.value;
  if(t.id==='iq'){UI.iq=t.value;render()}
  if(t.id==='cq'){UI.cq=t.value;render()}
  if(t.id==='dNum'){scan.draft.number=t.value;scan.draft.dupOk=false}
  if(t.id==='dNewSup')scan.draft.newSupplier=t.value;
  if(t.dataset.lf&&!['promo','credit','other'].includes(t.dataset.lf)){const el=t.closest('.line'),i=+el.dataset.line,l=scan.draft.lines[i],f=t.dataset.lf;
    if(f==='total'){l.total=t.value;const q=parseQty(l.qty).q;if(q>0&&num(t.value)!==0){l.price=String(Math.round(num(t.value)/q*100)/100*(l.credit&&num(t.value)>0?-1:1));const pe=el.querySelector('[data-lf="price"]');if(pe)pe.value=l.price}}
    else{l[f]=t.value;if(f==='price'&&l.credit&&num(t.value)>0)l.price=String(-num(t.value));if(f==='qty'||f==='price'){const te=el.querySelector('[data-lf="total"]');if(te&&num(parseQty(l.qty).q)&&num(l.price))te.value=round2(parseQty(l.qty).q*num(l.price)).toFixed(2)}}
    refreshCmp()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.grp){UI.iopen=UI.iopen||{};UI.iopen[d.dataset.grp]=d.open}},true);
window.addEventListener('hashchange',()=>{closeSheet();lastView=null;render()});
boot();
})();
</script>
