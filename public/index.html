<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoices">
<meta name="description" content="Scan supplier invoices and track every price your restaurant pays.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Invoices &amp; Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = slim sidebar + content column; phone = top bar + content + fixed bottom tab bar with a raised Scan button. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#eceeea; --line:#dfe2dc; --ink:#18201d; --ink-2:#4b5651; --muted:#76817b;
  --accent:#1d5c7a; --accent-ink:#ffffff; --accent-soft:#e2edf2;
  --up:#c23f2a; --up-soft:#fbe9e5; --down:#2c7a4b; --down-soft:#e3f2e8; --warn:#9a6512; --warn-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(24,32,29,.06),0 6px 22px rgba(24,32,29,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191e1c; --surface-2:#222826; --line:#2e3532; --ink:#eef1ee; --ink-2:#bcc5c0; --muted:#8c9791;
  --accent:#6fb3d4; --accent-ink:#0d1a21; --accent-soft:#1b2d36;
  --up:#ff8a74; --up-soft:#3a1f1a; --down:#74c995; --down-soft:#1a2f22; --warn:#e7b25a; --warn-soft:#33281a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191e1c; --surface-2:#222826; --line:#2e3532; --ink:#eef1ee; --ink-2:#bcc5c0; --muted:#8c9791;
  --accent:#6fb3d4; --accent-ink:#0d1a21; --accent-soft:#1b2d36;
  --up:#ff8a74; --up-soft:#3a1f1a; --down:#74c995; --down-soft:#1a2f22; --warn:#e7b25a; --warn-soft:#33281a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{padding-bottom:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:750}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.brand b{font-family:var(--f-display);font-size:17px;line-height:1.05;display:block}
.brand small{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:0;border-radius:10px;background:none;text-align:left;color:var(--ink-2);font-weight:600}
.navbtn:hover{background:var(--surface-2)}
.navbtn.on{background:var(--accent-soft);color:var(--ink)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn .count{margin-left:auto}
.side .scanbig{margin:8px 0 14px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
.topbar{display:none}
.tabbar{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.pagehead p{color:var(--muted);margin-top:4px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:650;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--up);border-color:var(--up-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.field{width:100%;min-width:0;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.field{appearance:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 200px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;font-family:var(--f-mono)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.flat{background:var(--surface-2);color:var(--muted)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.count{min-width:22px;height:22px;border-radius:99px;background:var(--up);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-family:var(--f-mono)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 10px}
.panel-b{padding:0 18px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.kpi .v{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:12px}
.kpi.alert .v{color:var(--up)}
button.kpi{cursor:pointer;color:inherit}
button.kpi:hover{border-color:var(--accent)}

.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);margin-bottom:16px;border:1px solid var(--line);background:var(--surface)}
.banner.alert{background:var(--up-soft);border-color:transparent}
.banner.alert b{color:var(--up)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1 1 220px;min-width:0}

/* Rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .t{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;min-width:0}
.row .r{text-align:right}
.price{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:12px}

/* Product table (desktop) */
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--surface-2)}
table.list .num{text-align:right;white-space:nowrap}
.cards{display:none}

/* Alerts */
.alertcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:16px 18px;border-top:1px solid var(--line)}
.alertcard:first-child{border-top:0}
.alertcard .big{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--up);text-align:right}
.alertcard .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.alertcard.done .big{color:var(--muted)}
.fromto{font-family:var(--f-mono);font-size:14px;margin-top:4px}
.fromto s{color:var(--muted)}
.note{margin-top:6px;font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:8px}

/* Bars & charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .bar{fill:var(--accent);opacity:.82}
.chart .bar.cur{opacity:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.share{display:grid;gap:12px}
.share-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
.meter{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:9px}

/* Scan */
.scan-hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:22px;text-align:center;justify-items:center}
.cam{display:grid;place-items:center;gap:6px;width:100%;max-width:420px;padding:28px 16px;border-radius:18px;border:2px dashed var(--line);background:var(--surface-2);position:relative;cursor:pointer}
.cam:hover{border-color:var(--accent)}
.cam svg{width:44px;height:44px;color:var(--accent)}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cam b{font-family:var(--f-display);font-size:19px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%;max-width:520px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.thumb .pg{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px;font-family:var(--f-mono)}
.addpage{display:grid;place-items:center;aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-size:13px;font-weight:600;position:relative;text-align:center;padding:6px}
.addpage input{position:absolute;inset:0;opacity:0;width:100%}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reviewgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.photostrip{display:grid;gap:10px}
.photostrip img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.form2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fl{display:grid;gap:5px;min-width:0}
.fl>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.line{padding:10px 0;border-top:1px solid var(--line)}
.ledit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.55fr) minmax(0,.85fr) minmax(0,.75fr) minmax(0,.8fr) minmax(0,.8fr) 40px;gap:8px;align-items:end;margin-top:10px}
.line:not(.open) .ledit{display:none}
.lsum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.lsum .ln{font-weight:650;overflow-wrap:anywhere}
.lsum .ld{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.lsum .lr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lsum .lr .price{font-size:16px}
.lsum .cmp,.lsum .extras{grid-column:1/-1}
.line.issue{background:linear-gradient(90deg,var(--warn-soft),transparent 60%);border-radius:8px;padding-inline:8px}
.line .cmp{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line .lt{font-size:13px;margin-right:6px}
.line .x{min-height:44px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:10px}
.line .x:hover{background:var(--up-soft);color:var(--up)}
.totals{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:2px solid var(--ink);margin-top:4px}
.totals .price{font-size:22px}
.savebar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.result{display:grid;gap:12px;justify-items:center;text-align:center;padding:28px 18px}
.tick{width:58px;height:58px;border-radius:50%;background:var(--down-soft);color:var(--down);display:grid;place-items:center}
.tick svg{width:30px;height:30px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,16,14,.5);padding:16px}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.closex{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.fact{background:var(--surface-2);border-radius:11px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-mono);font-size:17px;margin-top:3px}
.invoice-photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:10px}
.empty{padding:36px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.newver{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);cursor:pointer}
.supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.supcard{display:grid;gap:10px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;min-width:0}
.supcard:hover{border-color:var(--accent)}
.supcard.hot{border-color:var(--up);box-shadow:0 0 0 1px var(--up) inset}
.sc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.sc-top b{font-size:17px}
.sc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sc-stats span{display:grid;font-size:12px;color:var(--muted)}.sc-stats b{font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.sect{font-size:15px;margin:4px 0 10px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;text-align:left}.linkbtn:hover{color:var(--accent);text-decoration:underline}.linkbtn.small{font-size:13px;color:var(--accent)}
.backbtn{margin-bottom:6px;padding-inline:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabb{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:650;color:var(--muted);white-space:nowrap;font:inherit;font-weight:650;cursor:pointer}
.tabb.on{color:var(--ink);border-bottom-color:var(--accent)}.tabb.hot{color:var(--up)}
.alertbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-bottom:16px;border-radius:var(--r);border:1px solid var(--up);background:var(--up-soft);color:var(--ink);cursor:pointer}
.alertbar .ab-i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--up);color:var(--surface);flex:none}.alertbar .ab-i svg{width:20px;height:20px}
.alertbar .ab-t{flex:1;min-width:0;display:grid}.alertbar .ab-t b{color:var(--up);font-size:16px}.alertbar .ab-t small{color:var(--ink-2);font-size:13px}
.alertbar .ab-go{font-weight:700;color:var(--up);white-space:nowrap}
.alertbar.warnbar{border-color:var(--warn);background:var(--warn-soft)}.alertbar.warnbar .ab-i{background:var(--warn)}.alertbar.warnbar b,.alertbar.warnbar .ab-go{color:var(--warn)}
.alertsum{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border-radius:var(--r);background:var(--up-soft)}.alertsum .as-n{font-family:var(--f-mono);font-size:34px;font-weight:700;color:var(--up)}.alertsum span{display:grid}.alertsum b{color:var(--up);font-size:16px}.alertsum small{color:var(--ink-2)}
.grp>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;cursor:pointer;list-style:none}.grp>summary::-webkit-details-marker{display:none}
.grp .g-t{display:grid;min-width:0}.grp .g-t b{font-size:16px}.grp .g-t small{color:var(--muted);font-size:12px}
.grp .g-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.grp .chev{font-size:22px;color:var(--muted);transition:transform .15s}.grp[open] .chev{transform:rotate(90deg)}
.grp .g-foot{padding:10px 18px;border-top:1px solid var(--line)}
.cmp-unit{padding:8px 18px 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ov{margin-bottom:16px}

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9ก-๙]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso+'T12:00:00');return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtShort=iso=>{const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const round2=n=>Math.round(n*100)/100;

const I={
 import:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3 3 3-3"/></svg>',

 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
 scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 alerts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
 invoices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
 suppliers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/></svg>',
 compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0z"/><path d="M19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></svg>',
 settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 gallery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',

};

const SUBS={home:'Everything you are paying, updated from every invoice.',suppliers:'Tap a supplier to see its products and prices, its invoices and its price rises.',compare:'Type a product to see what every supplier charges for it, cheapest first.',scan:'Take a photo, upload a photo or PDF, or type it in. You check everything before it is saved.',alerts:'Every rise in a price per unit, found on your invoices.',invoices:'All invoices, grouped by supplier.',import:'Bring in a lot of invoices at once, from this device or a Google Drive folder.',settings:'Alert rules, email and logins.'};

/* ---------- state ---------- */
const S={sup:[],prod:[],inv:[],alerts:[],settings:{threshold:0,currency:'£',restaurant:'Geisha Restaurant',alertEmail:'',pinsEnabled:false},loaded:{},err:null,slow:false,noDb:false,role:null,features:{}};
const isOwner=()=>S.role==='owner';
const UI={pq:'',psup:'all',pfilter:'all',psort:'name',iq:'',isup:'all',afilter:'open',cq:''};

const cur=()=>'£';
const money=n=>{const v=Number(n||0);return (v<0?'−':'')+cur()+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const moneyU=n=>{const v=Math.abs(Number(n||0));const d=v<10&&Math.abs(v*100-Math.round(v*100))>0.05?3:2;return (Number(n)<0?'−':'')+cur()+v.toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d})};
const supName=id=>S.sup.find(s=>s.id===id)?.name||'Unknown supplier';
const sortedHist=p=>[...(p.history||[])].sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.t||0)-(b.t||0));
// Temporary discounts (short life, offers) never become the 'current' price.
const regHist=p=>{const h=sortedHist(p);const r=h.filter(x=>!x.promo);return r.length?r:h};
const latest=p=>{const h=regHist(p);return h.length?h[h.length-1]:null};
const previous=p=>{const h=regHist(p);return h.length>1?h[h.length-2]:null};
const lastOffer=p=>{const h=sortedHist(p);const x=h[h.length-1];return x&&x.promo?x:null};
const change=p=>{const l=latest(p),pr=previous(p);if(!l||!pr||!pr.p)return null;const d=round2(l.p-pr.p);return {diff:d,pct:d/pr.p*100}};
const realInv=()=>S.inv.filter(i=>i.source!=='pricelist');
const openAlerts=()=>S.alerts.filter(a=>a.status!=='reviewed');

async function api(path,opts={}){
  const o={method:opts.method||'GET',headers:{...(opts.headers||{})},credentials:'same-origin'};
  if(opts.body instanceof Blob){o.body=opts.body}else if(opts.body!==undefined){o.body=JSON.stringify(opts.body);o.headers['content-type']='application/json'}
  let r;
  try{r=await fetch(path,o)}catch(e){throw Object.assign(new Error('No connection. Check the internet and try again.'),{offline:true})}
  checkVersion(r.headers.get('x-app-version'));
  let data={};try{data=await r.json()}catch(e){}
  if(r.status===401&&data.code==='AUTH'){S.role=null;if(!S.loginMode||S.loginMode==='open')S.loginMode='password';showGate();}
  if(!r.ok)throw Object.assign(new Error(data.error||'Something went wrong. Try again.'),{status:r.status,code:data.code});
  return data;
}
/* A new version was deployed: reload open pages so nobody keeps using an old copy. */
let APPV=null,newVer=false;
function checkVersion(v){if(!v)return;if(!APPV){APPV=v;return}if(v!==APPV&&!newVer){newVer=true;updateApp()}}
function busyNow(){return scan.step==='review'||IMP.running||DRV.busy||!!document.querySelector('#main input:focus,#main textarea:focus,#main select:focus')}
function updateApp(){
  if(!busyNow()){location.reload();return}
  if($('#newver'))return;
  const b=document.createElement('button');b.id='newver';b.className='newver';b.textContent='New version ready. Tap to update (save your work first).';b.onclick=()=>location.reload();document.body.appendChild(b);
}
setInterval(()=>{if(newVer&&!busyNow())location.reload()},15000);
setInterval(()=>{if(document.visibilityState==='visible'&&!$('#gate').hidden)api('/api/session').catch(()=>{})},60000);
let loading=false;
async function load(){
  if(loading||!S.role)return;loading=true;
  if(!DRV.st&&!DRV.loading){DRV.loading=true;drvLoad().then(()=>{DRV.loading=false;if(DRV.st?.connected&&!DRV.lastAuto){DRV.lastAuto=Date.now();drvSync(false)}})}
  try{
    const d=await api('/api/data');
    S.sup=d.suppliers;S.prod=d.products;S.inv=d.invoices;S.alerts=d.alerts;S.settings={...S.settings,...d.settings};S.role=d.role;
    S.loaded.prod=true;S.err=null;S.slow=false;
  }catch(e){if(e.status!==401)S.err=e.message}
  finally{loading=false;schedule()}
}
setInterval(()=>{if(document.visibilityState==='visible'&&S.role&&scan.step!=='review')load()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});

let pin='';
function gateBrand(){return `<div class="brand"><div class="brand-mark">I&amp;P</div><div><b>Invoices &amp; Pricing</b><small>${esc(S.settings.restaurant||'Supplier price control')}</small></div></div>`}

  if(S.needsSetup){g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Set up your app</h1><p>Choose two PINs. You keep the owner PIN. Give the manager PIN to the people who scan invoices.</p>
  <form id="setupForm"><label class="fl"><span>Restaurant name</span><input class="field" id="suRest" autocomplete="organization" required maxlength="80"></label>
  <label class="fl"><span>Owner PIN (4–8 digits)</span><input class="field mono" id="suOwner" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="new-password" type="password" required></label>
  <label class="fl"><span>Manager PIN (4–8 digits)</span><input class="field mono" id="suMgr" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="off" required></label>
  
  <label class="fl"><span>Email for price alerts (optional)</span><input class="field" id="suEmail" type="email" autocomplete="email"></label>
  <div class="err" id="gateErr">${esc(msg)}</div><button class="btn primary" type="submit">Create app</button></form></div>`;
  $('#setupForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/session',{method:'POST',body:{action:'setup',restaurant:$('#suRest').value,ownerPin:$('#suOwner').value,managerPin:$('#suMgr').value,alertEmail:$('#suEmail').value}});S.needsSetup=false;S.role='owner';hideGate();toast('Your app is ready. Scan the first invoice.');load()}catch(err){$('#gateErr').textContent=err.message}};
  return}
  if(S.loginMode==='password'){g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Sign in</h1><form id="loginForm" autocomplete="on"><label class="fl"><span>Name or email</span><input class="field" id="lgUser" name="username" autocomplete="username" autocapitalize="none" required></label><label class="fl"><span>Password</span><input class="field" id="lgPass" name="password" type="password" autocomplete="current-password" required></label><div class="err" id="gateErr">${esc(msg)}</div><button class="btn primary bigbtn" type="submit">Sign in</button></form></div>`;
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;if(b)b.disabled=true;try{const r=await api('/api/session',{method:'POST',body:{action:'login',username:$('#lgUser').value,password:$('#lgPass').value}});S.role=r.role;hideGate();boot()}catch(err){$('#gateErr').textContent=err.message;if(b)b.disabled=false}};
    setTimeout(()=>$('#lgUser')?.focus(),50);return}
  pin='';
  g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Enter your PIN</h1><p>Owner or manager PIN</p><div class="pinrow" id="pinDots"></div><div class="err" id="gateErr">${esc(msg)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}<button class="ghostkey" data-key="clear">Clear</button><button data-key="0">0</button><button class="ghostkey" data-key="ok">Enter</button></div></div>`;
  dots();
}
function dots(){const el=$('#pinDots');if(el)el.innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<span class="${i<pin.length?'on':''}"></span>`).join('')}
async function tryLogin(){
  if(pin.length<4)return;const p=pin;pin='';dots();
  try{const r=await api('/api/session',{method:'POST',body:{action:'login',pin:p}});S.role=r.role;hideGate();load()}
  catch(e){$('#gateErr').textContent=e.message}
}
$('#gate').addEventListener('click',e=>{
  const k=e.target.closest('[data-key]')?.dataset.key;if(!k)return;
  if(k==='clear'){pin=''}else if(k==='ok'){tryLogin();return}else if(pin.length<8){pin+=k}
  $('#gateErr').textContent='';dots();
});
document.addEventListener('keydown',e=>{if($('#gate').hidden||S.needsSetup||S.noDb||S.loginMode==='password')return;if(/^\d$/.test(e.key)&&pin.length<8){pin+=e.key;dots()}else if(e.key==='Backspace'){pin=pin.slice(0,-1);dots()}else if(e.key==='Enter')tryLogin()});
function hideGate(){$('#gate').hidden=true;$('#gate').innerHTML='';render()}
async function boot(){
  render();
  try{
    const s=await api('/api/session');
    S.features=s.features||{};
    if(s.error==='NO_DB'){S.noDb=true;showGate();return}
    S.needsSetup=!!s.needsSetup;S.settings={...S.settings,...(s.settings||{})};S.role=s.role;S.loginMode=s.loginMode||'open';S.accounts=s.accounts||[];
    if(!S.role)showGate();else{load()}
  }catch(e){S.err=e.message;render()}
}
async function signOut(){try{await api('/api/session',{method:'POST',body:{action:'logout'}})}catch(e){}S.role=null;S.sup=[];S.prod=[];S.inv=[];S.alerts=[];S.loaded={};showGate()}

  const d30=new Date(now);d30.setDate(now.getDate()-30);const d30ISO=d30.toISOString().slice(0,10);
  const changes=S.prod.map(p=>({p,c:change(p),l:latest(p),pr:previous(p)})).filter(x=>x.c&&Math.abs(x.c.diff)>0.004&&(x.l.d||'')>=d30ISO).sort((a,b)=>b.c.pct-a.c.pct);

  h+=`<div class="grid2"><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Latest invoices</h2><button class="btn ghost sm" data-go="invoices">All invoices →</button></div><div class="rows">${recent.map(i=>{const al=S.alerts.filter(a=>a.invoiceId===i.id&&a.status!=='reviewed').length;return `<button class="row" data-invoice="${esc(i.id)}"><span class="t">${esc(supName(i.supplierId))}</span><span class="r price">${money(i.total)}</span><span class="s"><span class="mono">${esc(i.number||'No number')}</span> · ${fmtDate(i.date)} · ${plural((i.lines||[]).length,'line')}</span><span class="r">${al?`<span class="pill up">${plural(al,'rise')}</span>`:''}</span></button>`}).join('')||'<div class="empty small">No invoices yet.</div>'}</div></section>
  </div><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Weekly spend</h2><span class="label">last 8 weeks</span></div><div class="panel-b">${spendChart()}</div></section>

function supplierShare(from){
  const t={};realInv().filter(i=>(i.date||'')>=from).forEach(i=>t[i.supplierId]=(t[i.supplierId]||0)+num(i.total));
  const arr=Object.entries(t).sort((a,b)=>b[1]-a[1]);const tot=arr.reduce((a,x)=>a+x[1],0);
  if(!arr.length)return '<p class="muted small">No invoices this month yet.</p>';
  return arr.map(([id,v])=>`<div><div class="share-l"><span>${esc(supName(id))}</span><b class="mono">${money(v)}</b></div><div class="meter"><span style="width:${(v/tot*100).toFixed(1)}%"></span></div></div>`).join('');
}
function spendChart(){
  const weeks=[];const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);mon.setHours(0,0,0,0);
  for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-i*7);const e=new Date(s);e.setDate(s.getDate()+7);weeks.push({s,e,v:0})}
  realInv().forEach(inv=>{const d=new Date((inv.date||'')+'T12:00:00');const w=weeks.find(w=>d>=w.s&&d<w.e);if(w)w.v+=num(inv.total)});
  const max=Math.max(...weeks.map(w=>w.v));if(!max)return '<p class="muted small">Spend appears here once invoices are scanned.</p>';
  const nice=niceMax(max),W=560,H=190,L=48,R=10,T=10,B=26,bw=(W-L-R)/weeks.length;
  let g='';[0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${esc(cur()+Math.round(nice*f).toLocaleString('en-GB'))}</text>`});
  weeks.forEach((w,i)=>{const hh=(H-T-B)*(w.v/nice),x=L+i*bw+bw*.18,y=H-B-hh;g+=`<rect class="bar ${i===7?'cur':''}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(hh,w.v?2:0)}" rx="4" fill="currentColor"><title>Week of ${fmtShort(w.s.toISOString().slice(0,10))}: ${money(w.v)}</title></rect><text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${i===7?'This wk':fmtShort(w.s.toISOString().slice(0,10))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly spend for the last 8 weeks">${g}</svg>`;
}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function supOptions(sel,allLabel){return `<option value="all">${allLabel}</option>`+[...S.sup].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${esc(s.id)}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}

/* one row per product with its current price, plus the cheapest matching product at another supplier */
function priceRows(supplierId){
  return S.prod.filter(p=>p.supplierId===supplierId).map(p=>{
    const l=latest(p),pr=previous(p),c=change(p);
    const key=norm(p.name)+'|'+norm(p.unit);
    const others=S.prod.filter(o=>o.supplierId!==supplierId&&norm(o.name)+'|'+norm(o.unit)===key).map(o=>({o,l:latest(o)})).filter(z=>z.l).sort((a,b)=>a.l.p-b.l.p);
    return {p,l,pr,c,best:others[0]||null,offer:lastOffer(p)};
  }).sort((a,b)=>a.p.name.localeCompare(b.p.name));
}
function elsewhere(x){
  if(!x.best||!x.l)return '';
  const d=round2(x.l.p-x.best.l.p);

        IMP.note=`Google is busy or the per-minute limit was reached. Waiting a minute, then carrying on (try ${limitHits} of 3).`;schedule();await sleep(65000);IMP.note='';

function prodTable(rows,{showSup=false}={}){

  return `<div class="tablewrap table-d"><table class="list"><thead><tr><th>Product</th>${showSup?'<th>Supplier</th>':''}<th class="num">Price</th><th>Per</th><th class="num">Before</th><th class="num">Change</th><th class="num">Last bought</th><th>Other suppliers</th></tr></thead><tbody>${rows.map(x=>`<tr data-product="${esc(x.p.id)}" tabindex="0"><td><b>${esc(x.p.name)}</b>${x.offer?` <span class="pill new">Offer ${moneyU(x.offer.p)}</span>`:''}</td>${showSup?`<td>${esc(supName(x.p.supplierId))}</td>`:''}<td class="num price">${x.l?moneyU(x.l.p):'—'}</td><td class="muted">${esc(x.p.unit)}</td><td class="num mono muted">${x.pr?moneyU(x.pr.p):'—'}</td><td class="num">${x.pr?pill(x.c):'<span class="muted small">—</span>'}</td><td class="num small muted">${x.l?fmtShort(x.l.d):'—'}</td><td>${elsewhere(x)}</td></tr>`).join('')}</tbody></table></div>
  <div class="rows cards">${rows.map(x=>`<button class="row" data-product="${esc(x.p.id)}"><span class="t">${esc(x.p.name)}</span><span class="r price">${x.l?moneyU(x.l.p):'—'}<small>/${esc(x.p.unit)}</small></span><span class="s">${showSup?esc(supName(x.p.supplierId))+' · ':''}${x.pr&&x.c&&Math.abs(x.c.diff)>0.004?`was ${moneyU(x.pr.p)} · `:''}${x.l?fmtShort(x.l.d):''}</span><span class="r">${x.pr&&x.c&&Math.abs(x.c.diff)>0.004?pill(x.c):elsewhere(x)}</span></button>`).join('')}</div>`;
}
function vSuppliers(){
  const q=norm(UI.sq||'');
  let h=head('suppliers',`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn hide-m" data-act="csv">Download price list</button><button class="btn primary" data-act="newPricelist">+ Add supplier prices</button></div>`)+stateBanner();
  h+=`<div class="toolbar"><input class="field search" id="sq" type="search" placeholder="Find a supplier or a product, e.g. lemons" value="${esc(UI.sq||'')}" aria-label="Search suppliers and products"></div>`;
  if(!S.sup.length)return h+`<div class="panel"><div class="empty"><b>No suppliers yet</b><p>Each supplier appears here after its first invoice. You can also add a supplier's prices by hand.</p><button class="btn primary" data-act="newPricelist">+ Add supplier prices</button></div></div>`;
  const sups=[...S.sup].sort((a,b)=>supStats(b.id).oa.length-supStats(a.id).oa.length||a.name.localeCompare(b.name));
  if(!q)return h+`<div class="supgrid">${sups.map(supCard).join('')}</div>`;
  const named=sups.filter(s=>norm(s.name).includes(q));
  const hits=sups.map(sp=>({sp,rows:priceRows(sp.id).filter(x=>norm(x.p.name).includes(q))})).filter(g=>g.rows.length);
  if(named.length)h+=`<h2 class="sect">Suppliers</h2><div class="supgrid" style="margin-bottom:18px">${named.map(supCard).join('')}</div>`;
  if(hits.length)h+=`<h2 class="sect">Products matching “${esc(UI.sq)}”</h2><div class="stack">${hits.map(g=>`<section class="panel"><div class="panel-h"><h2><button class="linkbtn" data-supplier="${esc(g.sp.id)}">${esc(g.sp.name)} ›</button></h2><span class="small muted">${plural(g.rows.length,'product')}</span></div>${prodTable(g.rows)}</section>`).join('')}</div>`;
  if(!named.length&&!hits.length)h+=`<div class="panel"><div class="empty"><b>Nothing matches “${esc(UI.sq)}”</b><p>Try a shorter word, or check the spelling.</p></div></div>`;
  return h;
}
function vSupplier(){
  const sp=S.sup.find(s=>s.id===UI.sid);
  const back=`<button class="btn ghost sm backbtn" data-go="suppliers">← All suppliers</button>`;
  if(!sp)return back+(S.loaded.prod?'<div class="panel"><div class="empty"><b>Supplier not found</b><p>It may have been removed.</p></div></div>':'<div class="panel"><div class="empty">Loading…</div></div>');
  const st=supStats(sp.id),tab=UI.stab||'products';
  let h=back+`<div class="pagehead"><div><h1>${esc(sp.name)}</h1><p>${plural(st.ps.length,'product')} · ${plural(st.inv.length,'invoice')}${st.last?` · last delivery ${fmtDate(st.last)}`:''}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${isOwner()?`<button class="btn" data-act="addTo" data-sup="${esc(sp.id)}">+ Add prices</button>`:''}<button class="btn primary" data-go="scan">${I.scan}Add invoice</button></div></div>`+stateBanner();
  h+=`<div class="kpis"><button class="kpi" data-stab="invoices"><span class="label">Spend this month</span><span class="v">${money(st.month)}</span><small>${money(st.all)} in total</small></button><button class="kpi" data-stab="products"><span class="label">Products</span><span class="v">${st.ps.length}</span><small>${st.ups} went up</small></button><button class="kpi" data-stab="invoices"><span class="label">Invoices</span><span class="v">${st.inv.length}</span><small>${st.last?'last '+fmtShort(st.last):'none yet'}</small></button><button class="kpi ${st.oa.length?'alert':''}" data-stab="alerts"><span class="label">Price rises to review</span><span class="v">${st.oa.length}</span><small>${st.oa.length?'tap to see':'all clear'}</small></button></div>`;
  h+=`<div class="tabs" role="tablist">${[['products',`Products (${st.ps.length})`],['invoices',`Invoices (${st.inv.length})`],['alerts',`Alerts${st.oa.length?` (${st.oa.length})`:''}`]].map(([k,l])=>`<button class="tabb ${tab===k?'on':''} ${k==='alerts'&&st.oa.length?'hot':''}" role="tab" aria-selected="${tab===k}" data-stab="${k}">${l}</button>`).join('')}</div>`;
  if(tab==='products'){
    const q=norm(UI.spq||'');const rows=priceRows(sp.id).filter(x=>!q||norm(x.p.name).includes(q));
    h+=`<div class="toolbar"><input class="field search" id="spq" type="search" placeholder="Search ${esc(sp.name)}'s products" value="${esc(UI.spq||'')}" aria-label="Search this supplier's products"></div>`;
    h+=`<section class="panel">${rows.length?prodTable(rows):`<div class="empty"><b>${q?'No products match':'No products yet'}</b><p>${q?'Try another word.':'Products appear after the first invoice from this supplier.'}</p></div>`}</section>`;
    if(isOwner()&&rows.length)h+='<p class="small muted" style="margin-top:8px">Tap a product to see its full price history or change its price.</p>';
  }else if(tab==='invoices'){
    const list=S.inv.filter(i=>i.supplierId===sp.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
    if(!list.length)h+='<div class="panel"><div class="empty"><b>No invoices yet</b><p>Add an invoice from this supplier and it appears here.</p></div></div>';
    const months={};list.forEach(i=>(months[(i.date||'').slice(0,7)]||=[]).push(i));
    h+='<div class="stack">'+Object.entries(months).map(([m,arr])=>{const d=new Date(m+'-15T12:00:00');return `<section class="panel"><div class="panel-h"><h2>${isNaN(d)?'No date':d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><span class="small muted">${plural(arr.filter(i=>i.source!=='pricelist').length,'invoice')} · <b class="mono">${money(arr.filter(i=>i.source!=='pricelist').reduce((a,i)=>a+num(i.total),0))}</b></span></div><div class="rows">${arr.map(invRow).join('')}</div></section>`}).join('')+'</div>';
  }else{
    const list=S.alerts.filter(a=>a.supplierId===sp.id).sort((a,b)=>(a.status==='reviewed')-(b.status==='reviewed')||(b.date||'').localeCompare(a.date||''));
    h+=list.length?`<div class="panel">${list.map(alertCard).join('')}</div>`:'<div class="panel"><div class="empty"><b>No price rises from this supplier</b><p>When an invoice shows a higher price per unit than last time, it appears here.</p></div></div>';
  }
  return h;
}
function invRow(i){
  const al=S.alerts.filter(a=>a.invoiceId===i.id&&a.status!=='reviewed').length;
  return `<button class="row" data-invoice="${esc(i.id)}"><span class="t">${i.source==='pricelist'?'Price change / price list':`Invoice <span class="mono">${esc(i.number||'(no number)')}</span>`}</span><span class="r price">${i.source==='pricelist'?'':money(i.total)}</span><span class="s">${fmtDate(i.date)} · ${plural((i.lines||[]).length,'line')}${i.photos?.length?(i.photos.some(a=>/\.pdf/i.test(a))?' · PDF':' · photo'):''}</span><span class="r">${al?`<span class="pill up">${plural(al,'price rise')}</span>`:''}</span></button>`;
}

/* ---------- invoices grouped by supplier ---------- */
function vInvoices(){
  const q=norm(UI.iq);
  const list=S.inv.filter(i=>!q||norm((i.number||'')+' '+supName(i.supplierId)+' '+(i.date||'')).includes(q));
  let h=head('invoices',`<button class="btn primary hide-m" data-go="scan">${I.scan}Add invoice</button>`)+stateBanner();
  h+=`<div class="toolbar"><input class="field search" id="iq" type="search" placeholder="Search supplier, invoice number or date" value="${esc(UI.iq)}" aria-label="Search invoices"></div>`;
  if(!list.length)return h+`<div class="panel"><div class="empty"><b>${S.inv.length?'No invoices match':'No invoices yet'}</b><p>${S.inv.length?'Try another search.':'Saved invoices are kept here with their photos, grouped by supplier.'}</p></div></div>`;
  const g={};list.forEach(i=>(g[i.supplierId]||=[]).push(i));
  const groups=Object.entries(g).map(([id,arr])=>({id,arr:arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0))})).sort((a,b)=>supName(a.id).localeCompare(supName(b.id)));
  const real=list.filter(i=>i.source!=='pricelist');
  UI.iopen=UI.iopen||{};
  h+=`<p class="small muted" style="margin-bottom:10px">${plural(real.length,'invoice')} from ${plural(groups.length,'supplier')} · ${money(real.reduce((a,i)=>a+num(i.total),0))}. Tap a supplier to open its invoices.</p>`;
  h+='<div class="stack">'+groups.map(({id,arr})=>{
    const r=arr.filter(i=>i.source!=='pricelist'),al=openAlerts().filter(a=>a.supplierId===id).length;
    const open=!!q||groups.length===1||UI.iopen[id];
    return `<details class="panel grp" data-grp="${esc(id)}" ${open?'open':''}><summary><span class="g-t"><b>${esc(supName(id))}</b><small>${plural(r.length,'invoice')}${arr[0]?.date?` · last ${fmtShort(arr[0].date)}`:''}</small></span><span class="g-r">${al?`<span class="pill up">${plural(al,'price rise')}</span>`:''}<b class="mono">${money(r.reduce((a,i)=>a+num(i.total),0))}</b><span class="chev" aria-hidden="true">›</span></span></summary><div class="rows">${arr.map(invRow).join('')}<div class="g-foot"><button class="btn sm ghost" data-supplier="${esc(id)}">Open ${esc(supName(id))}'s products & prices →</button></div></div></details>`;
  }).join('')+'</div>';
  return h;
}

/* ---------- alerts ---------- */
function alertCard(a){
  return `<div class="alertcard ${a.status==='reviewed'?'done':''}"><div><b>${esc(a.productName)}</b> <span class="muted small">· ${esc(supName(a.supplierId))}</span><div class="fromto"><s>${moneyU(a.from)}</s> → <b>${moneyU(a.to)}</b> <span class="muted">per ${esc(a.unit)}</span></div>${num(a.pct)>75?'<div class="note" style="background:var(--warn-soft)">Very large jump. Check whether the pack size changed (e.g. bunch → box) before contacting the supplier.</div>':''}<div class="small muted">Invoice <span class="mono">${esc(a.invoiceNumber||'—')}</span> · ${fmtDate(a.date)}${num(a.qty)?` · ${num(a.qty)} ${esc(a.unit)} bought = ${money(num(a.diff)*num(a.qty))} extra`:''}</div>${a.note?`<div class="note">${esc(a.note)}</div>`:''}</div><div class="big">+${num(a.pct).toFixed(1)}%<div class="small mono">+${moneyU(a.diff)}</div></div><div class="acts">${a.status==='reviewed'?`<span class="pill down">${I.check.replace('<svg','<svg width="13" height="13"')} Reviewed</span>${isOwner()?`<button class="btn sm ghost" data-reopen="${esc(a.id)}">Reopen</button>`:''}`:(isOwner()?`<button class="btn sm primary" data-review="${esc(a.id)}">Mark reviewed</button>`:'<span class="pill warn">Waiting for owner</span>')}<button class="btn sm" data-product="${esc(a.productId)}">Price history</button>${a.invoiceId?`<button class="btn sm" data-invoice="${esc(a.invoiceId)}">View invoice</button>`:''}</div></div>`;
}
function alertBar(v){
  const oa=openAlerts();if(!oa.length||v==='alerts'||v==='scan')return '';
  const extra=oa.reduce((a,x)=>a+Math.max(0,num(x.diff))*Math.max(1,num(x.qty)||1),0);
  const sups=[...new Set(oa.map(a=>supName(a.supplierId)))];
  return `<button class="alertbar" data-go="alerts"><span class="ab-i">${I.alerts}</span><span class="ab-t"><b>${plural(oa.length,'price increase')} to review</b><small>${esc(sups.slice(0,3).join(', '))}${sups.length>3?` +${sups.length-3} more`:''} · about ${money(extra)} extra</small></span><span class="ab-go">Review →</span></button>`;
}
function howAlerts(){
  const thr=num(S.settings.threshold);
  return `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>When does a price alert appear?</h2></div><div class="panel-b"><ol class="howto">
  <li><span>An invoice is saved (photo, PDF or typed in).</span></li>
  <li><span>The same product was bought from the <b>same supplier</b> before.</span></li>
  <li><span>The price <b>per unit</b> (per kg, per bunch, each) is higher than last time${thr>0?` by ${thr}% or more`:''}. Buying a bigger quantity never causes an alert.</span></li></ol>
  <p class="small muted" style="margin-top:8px">Old invoices brought in with Import many build the price history but only alert when they are from the last 14 days. Temporary offers are not used as the normal price. ${S.features.email?'Alerts are also emailed to the address in Settings.':'Email alerts are not switched on yet, so alerts show here and on every page.'}</p></div></section>`;
}
function vAlerts(){
  let list=[...S.alerts].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  if(UI.afilter==='open')list=list.filter(a=>a.status!=='reviewed');
  if(UI.afilter==='reviewed')list=list.filter(a=>a.status==='reviewed');
  const oa=openAlerts();
  let h=head('alerts',isOwner()&&oa.length>1?'<button class="btn" data-act="reviewAll">Mark all reviewed</button>':'')+stateBanner();
  if(oa.length){const extra=oa.reduce((a,x)=>a+Math.max(0,num(x.diff))*Math.max(1,num(x.qty)||1),0);h+=`<div class="alertsum"><span class="as-n">${oa.length}</span><span><b>price increase${oa.length>1?'s':''} waiting for review</b><small>About ${money(extra)} extra on the last orders, at the quantities bought.</small></span></div>`}
  h+=`<div class="chips">${[['open',`To review (${oa.length})`],['reviewed','Reviewed'],['all','All']].map(([k,l])=>`<button class="chip ${UI.afilter===k?'on':''}" data-afilter="${k}">${l}</button>`).join('')}</div>`;
  if(!list.length)return h+`<div class="panel"><div class="empty"><b>${UI.afilter==='open'?'All clear':'No alerts here'}</b><p>${UI.afilter==='open'?'No price increases waiting for review.':'Nothing in this list yet.'}</p></div></div>`+howAlerts();
  const g={};list.forEach(a=>(g[a.supplierId]||=[]).push(a));
  h+='<div class="stack">'+Object.entries(g).sort((a,b)=>supName(a[0]).localeCompare(supName(b[0]))).map(([id,arr])=>`<section class="panel"><div class="panel-h"><h2><button class="linkbtn" data-supplier="${esc(id)}">${esc(supName(id))} ›</button></h2><span class="pill ${arr.some(a=>a.status!=='reviewed')?'up':'flat'}">${arr.length}</span></div>${arr.map(alertCard).join('')}</section>`).join('')+'</div>';
  return h+howAlerts();
}

/* ---------- compare: similar products across suppliers ---------- */
const CW=new Set(['fresh','the','of','and','a','with','box','case','pack','tray','bag','bunch','bunches','each','kg','g','gr','ml','l','ltr','litre','x','pcs','pc','per','large','small','medium','uk','loose','premium','approx','catch','weight','sgl','single','tub','bottle','tin','jar','bucket','sack','net','punnet','head','dozen']);
const singW=w=>w.replace(/ies$/,'y').replace(/(oes|ses|xes|ches|shes)$/,m=>m.slice(0,-2)).replace(/s$/,'');
const ckey=name=>[...new Set(norm(name).split(' ').filter(w=>w&&w.length>1&&!CW.has(w)&&!/\d/.test(w)).map(singW))].sort().join(' ');
function compareGroups(){
  const g={};S.prod.forEach(p=>{const k=ckey(p.name);if(k)(g[k]=g[k]||[]).push(p)});
  return Object.values(g).filter(a=>new Set(a.map(p=>p.supplierId)).size>1);
}
function cmpPanel(title,prods){
  const items=prods.map(p=>({p,l:latest(p)})).filter(x=>x.l);
  const units={};items.forEach(x=>(units[sing(norm(x.p.unit))]||=[]).push(x));
  const blocks=Object.values(units).sort((a,b)=>b.length-a.length);
  return `<section class="panel"><div class="panel-h"><h3>${esc(title)}</h3><span class="small muted">${plural(new Set(items.map(x=>x.p.supplierId)).size,'supplier')}</span></div>${blocks.map(arr=>{arr.sort((a,b)=>a.l.p-b.l.p);const best=arr[0];return `${blocks.length>1?`<div class="cmp-unit">Per ${esc(best.p.unit)}</div>`:''}<div class="rows">${arr.map((x,i)=>`<button class="row" data-product="${esc(x.p.id)}"><span class="t">${esc(supName(x.p.supplierId))} <span class="muted small">${esc(x.p.name)}</span></span><span class="r price">${moneyU(x.l.p)}<small>/${esc(x.p.unit)}</small></span><span class="s">Last bought ${fmtShort(x.l.d)}</span><span class="r">${arr.length<2?'':i===0?'<span class="pill down">Cheapest</span>':`<span class="pill up">+${moneyU(x.l.p-best.l.p)}</span>`}</span></button>`).join('')}</div>`}).join('')}${blocks.length>1?'<p class="small muted" style="padding:8px 18px 14px">Sold in different units, so each unit is compared separately.</p>':''}</section>`;
}
function sing(u){const x=String(u||'').trim();return /^(each|single|sgl|piece|pc|pcs|item|unit|ea)$/.test(x)?'each':singW(x)}
function vCompare(){
  let h=head('compare')+stateBanner();
  const q=norm(UI.cq);
  h+=`<div class="toolbar"><input class="field search" id="cq" type="search" placeholder="Type a product, e.g. lemon, salmon, fries" value="${esc(UI.cq)}" aria-label="Search a product to compare"></div>`;
  if(q){
    const words=q.split(' ').map(singW);
    const hits=S.prod.filter(p=>{const n=norm(p.name).split(' ').map(singW).join(' ');return words.every(w=>n.includes(w))});
    if(!hits.length)return h+`<div class="panel"><div class="empty"><b>No product matches “${esc(UI.cq)}”</b><p>Try a shorter word.</p></div></div>`;
    const g={};hits.forEach(p=>{const k=ckey(p.name)||norm(p.name);(g[k]=g[k]||[]).push(p)});
    const multi=Object.values(g).filter(a=>new Set(a.map(p=>p.supplierId)).size>1);
    h+=`<p class="small muted" style="margin-bottom:10px">${plural(hits.length,'product')} found at ${plural(new Set(hits.map(p=>p.supplierId)).size,'supplier')}. Cheapest per unit first.</p>`;
    h+='<div class="stack">'+cmpPanel(`Everything matching “${UI.cq}”`,hits)+(multi.length>1?multi.map(a=>cmpPanel(a.sort((x,y)=>x.name.length-y.name.length)[0].name,a)).join(''):'')+'</div>';
    return h;
  }
  const groups=compareGroups().sort((a,b)=>a[0].name.localeCompare(b[0].name));
  if(!groups.length)return h+`<div class="panel"><div class="empty"><b>Type a product above to compare</b><p>No product has been found at two suppliers yet with a similar name. Type a word such as “lemon” to see every supplier's price for it.</p></div></div>`;
  h+=`<p class="small muted" style="margin-bottom:10px">${plural(groups.length,'product')} bought from more than one supplier. Type above to compare anything else.</p>`;
  h+='<div class="stack">'+groups.map(a=>cmpPanel(a.slice().sort((x,y)=>x.name.length-y.name.length)[0].name,a)).join('')+'</div>';
  return h;
}

      :`<div class="choices">

        <button class="choice" data-act="manual" ${ro?'disabled':''}>${I.invoices}<b>${pl?'Type the prices in':'Type it in'}</b><span class="small muted">Enter the products and prices yourself, or paste rows from a spreadsheet.</span></button>

    </div></section>`;
  }else if(st==='reading'){

function matchSupplier(name){const n=norm(name);if(!n)return null;return S.sup.find(s=>norm(s.name)===n)||S.sup.find(s=>{const m=norm(s.name);return m.length>3&&(n.includes(m)||m.includes(n))})||null}
function matchProduct(supplierId,name){const n=norm(name);if(!n||!supplierId||supplierId==='new')return null;return S.prod.find(p=>p.supplierId===supplierId&&norm(p.name)===n)||null}
function lastBefore(p,date){const h=sortedHist(p).filter(x=>(x.d||'')<=(date||'9999')&&!x.promo);return h.length?h[h.length-1]:null}

// Same rule as the server: a box of N of the usual unit is compared per that unit.
function basePreview(oldUnit,l){
  const COUNT=/^(each|single|sgl|piece|pc|pcs|item|unit|ea)$/;const sing=w=>{const x=String(w||'').toLowerCase().trim();return COUNT.test(x)?'each':x.replace(/(es|s)$/,'')};
  const base=sing(norm(oldUnit));if(!base||/\d/.test(base))return null;
  const text=[l.unit,l.packSize,l.note].filter(Boolean).join(' ').toLowerCase();let count=0;
  for(const m of text.matchAll(/(\d+(?:\.\d+)?)\s*(?:x\s*)?([a-z]+)/g))if(sing(m[2])===base){count=Number(m[1]);break}
  if(!count&&base==='each'){const m=text.match(/\((\d+)\)|\bof\s+(\d+)\b/);if(m)count=Number(m[1]||m[2])}
  if(!(count>1))return null;const packs=num(l.qty)||1;return {qty:packs*count,price:num(l.price)/count,unit:oldUnit,count};
}
function cmpHTML(l){
  if(l.other)return `<span class="pill flat">${num(l.price)<0?'Credit, money off':'Charge'} · not a product, no price tracking</span>`;
  const d=scan.draft;const p=matchProduct(d.supplierId,l.name);
  if(!l.name.trim())return '<span class="muted">Enter a product name</span>';
  if(!p)return `<span class="pill new">New product</span>`;
  const pr=lastBefore(p,d.date);if(!pr)return '<span class="pill new">First price</span>';
  const prUnit=(S.inv.find(v=>v.id===pr.inv)?.lines||[]).find(x=>x.productId===p.id)?.unit||p.unit;
  let price=num(l.price),conv='';
  if(norm(prUnit)!==norm(l.unit)){const b=basePreview(prUnit,l);if(b){price=b.price;conv=`<span class="pill flat">= ${b.qty} ${esc(prUnit)} at ${moneyU(b.price)} each</span>`}else return `<span class="pill flat">Different unit</span><span class="muted">Before: ${moneyU(pr.p)} per ${esc(prUnit)}. Not compared, no alert.</span>`}
  const unitWarn=conv;
  const diff=Math.round((price-pr.p)*10000)/10000,pct=pr.p?diff/pr.p*100:0;
  if(l.promo)return `<span class="pill new">Temporary price</span><span class="muted">Normal price ${money(pr.p)}. No alert, and it will not count as the new price.</span>${unitWarn}`;
  if(diff>0.004)return `<span class="pill up">▲ +${money(diff)} (${pct.toFixed(1)}%)</span><span class="muted">Last paid ${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
  if(diff<-0.004)return `<span class="pill down">▼ ${money(diff)} (${pct.toFixed(1)}%)</span><span class="muted">Last paid ${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
  return `<span class="pill flat">Same as last time</span><span class="muted">${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
}

const lineTotal=l=>round2(num(l.qty)*num(l.price));
function lineExtras(l){const bits=[];if(l.packSize)bits.push(`<span class="pill flat">Pack ${esc(l.packSize)}</span>`);if(l.vat!==''&&l.vat!=null)bits.push(`<span class="pill flat">VAT ${num(l.vat)}%</span>`);if(l.note)bits.push(`<span class="small muted">${esc(l.note)}</span>`);return bits.join('')}
// Bottom summary: each section's sub-total, then goods, VAT and the invoice total.
function summaryHTML(lines,{live=false}={}){
  const tot=l=>l.total!=null&&l.total!==''&&!live?num(l.total):round2(num(l.qty)*num(l.price));
  const cats=[];lines.forEach(l=>{const c=l.category||'';if(c&&!cats.includes(c))cats.push(c)});
  const goods=round2(lines.reduce((a,l)=>a+tot(l),0));
  const vat=round2(lines.reduce((a,l)=>a+(num(l.vat)?tot(l)*num(l.vat)/100:0),0));
  let h='<div class="summary">';
  if(cats.length>1)h+=cats.map(c=>`<div class="srow"><span>${esc(c)}</span><span class="mono">${money(lines.filter(l=>(l.category||'')===c).reduce((a,l)=>a+tot(l),0))}</span></div>`).join('')+'<div class="srule"></div>';
  if(vat>0.004)h+=`<div class="srow"><span>Goods (ex VAT)</span><span class="mono">${money(goods)}</span></div><div class="srow"><span>VAT</span><span class="mono">${money(vat)}</span></div>`;
  h+=`<div class="srow grand"><b>${vat>0.004?'Invoice total incl. VAT':'Invoice total'}</b><b class="price" id="${live?'dTot':''}">${money(goods+vat)}</b></div></div>`;
  return h;
}
function secFoot(c,lines,live){const sub=round2(lines.filter(x=>(x.category||'')===c).reduce((a,x)=>a+(live||x.total==null?round2(num(x.qty)*num(x.price)):num(x.total)),0));return `<div class="secfoot" data-cat="${esc(c)}"><span>${esc(c)} sub-total</span><span style="display:flex;gap:8px;align-items:center">${live?secNote(c):''}<b class="mono">${money(sub)}</b></span></div>`}
function secNote(c){const sec=(scan.draft?.sections||[]).find(x=>String(x.name||'').toLowerCase()===String(c).toLowerCase());if(!sec||!(num(sec.subtotal)>0))return '';const got=round2(scan.draft.lines.filter(x=>(x.category||'')===c).reduce((a,x)=>a+lineTotal(x),0));return Math.abs(got-num(sec.subtotal))>0.05?`<span class="pill up" style="text-transform:none;letter-spacing:0">Invoice says ${money(num(sec.subtotal))}</span>`:'<span class="pill down" style="text-transform:none;letter-spacing:0">✓ matches</span>'}
function lineIssue(l){return !String(l.name||'').trim()||(l.other?false:!(num(l.price)>0))||(scan.kind!=='pricelist'&&!(num(l.qty)>0))||(num(l.printed)>0&&Math.abs(lineTotal(l)-num(l.printed))>0.02)}
function lineOpen(l){return l._open??(scan.source!=='ai'||lineIssue(l))}
function lineSum(l,i){const open=lineOpen(l),bad=num(l.printed)>0&&Math.abs(lineTotal(l)-num(l.printed))>0.02;
  return `<div class="lsum"><div><div class="ln">${esc(l.name)||'<span class="muted">New line</span>'}</div><div class="ld">${lineDesc(l)||'Enter quantity and price'}</div></div><div class="lr"><b class="price">${num(l.qty)&&num(l.price)?money(lineTotal(l)):'–'}</b><button class="btn sm ${open?'':'ghost'}" data-toggleline="${i}">${open?'Done':'Edit'}</button></div>
  <div class="cmp">${bad?`<span class="pill up">Invoice says ${money(num(l.printed))}</span><span class="muted">Fix the quantity or price.</span>`:''}${cmpHTML(l)}</div><div class="extras">${lineExtras(l)}${open||num(l.price)<0||l.other||l.credit?`<label class="promo-t"><input type="checkbox" data-lf="credit" ${l.credit||num(l.price)<0?'checked':''}> Credit / money off</label><label class="promo-t" style="margin-left:0"><input type="checkbox" data-lf="other" ${l.other?'checked':''}> Not a product</label>`:''}${!l.other&&(l.promo||open)?`<label class="promo-t" style="margin-left:0"><input type="checkbox" data-lf="promo" ${l.promo?'checked':''}> Temporary discount${l.regularPrice?` (usually ${money(l.regularPrice)})`:''}</label>`:''}</div></div>`}
function lineHTML(l,i){return `<div class="line ${lineOpen(l)?'open':''} ${lineIssue(l)&&l.name?'issue':''}" data-line="${i}">${lineSum(l,i)}<div class="ledit"><label class="fl nm"><span>Product</span><input class="field" data-lf="name" value="${esc(l.name)}" list="prodNames"></label><label class="fl"><span>Pieces</span><input class="field mono" data-lf="pieces" inputmode="decimal" value="${esc(l.pieces||'')}" placeholder="–"></label><label class="fl"><span>Qty / weight</span><input class="field mono" data-lf="qty" value="${esc(l.qty)}" placeholder="e.g. 3.952 or 3kg 952g"></label><label class="fl"><span>Unit</span><input class="field" data-lf="unit" value="${esc(l.unit)}" placeholder="kg"></label><label class="fl"><span>Price per unit</span><input class="field mono" data-lf="price" inputmode="decimal" value="${esc(l.price)}"></label><label class="fl tot"><span>Line total £</span><input class="field mono" data-lf="total" inputmode="decimal" value="${num(l.qty)&&num(l.price)?lineTotal(l).toFixed(2):esc(l.total||'')}" placeholder="optional"></label><button class="x" data-rmline="${i}" aria-label="Remove line">×</button></div></div>`}
function lineDesc(l){if(!num(l.qty)||!num(l.price))return '';const u=(l.unit||'').trim();return `${num(l.pieces)?`${num(l.pieces)} pcs · `:''}${num(l.qty)} ${esc(u)} × ${money(num(l.price))}${u?'/'+esc(/\s/.test(u)&&/\d/.test(u)?u.split(/\s+/)[0]:u):''} = ${money(lineTotal(l))}`}

async function shrink(file){
  try{
    const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const m=2400,sc=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return b||file;
  }catch(e){return file}
}
async function addPhotos(files){
  const max=MAX_PAGES;
  for(const f of files){if(scan.photos.length>=max){toast(`Up to ${max} pages per invoice.`);break}const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);if(isPdf){if(f.size>4*1024*1024){toast('That PDF is over 4 MB. Save it smaller or take a photo instead.');continue}const b=f.type?f:new Blob([f],{type:'application/pdf'});scan.photos.push({blob:b,url:URL.createObjectURL(b),pdf:true});continue}if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|heic|webp)$/i.test(f.name)){toast('Choose a photo (JPG or PNG) or a PDF.');continue}const b=await shrink(f);scan.photos.push({blob:b,url:URL.createObjectURL(b)})}

let readAbort=null;
async function uploadPhotos(){
  for(const p of scan.photos){
    if(p.remote)continue;
    const r=await api('/api/upload',{method:'POST',body:p.blob,headers:{'content-type':'application/octet-stream','x-file-type':p.blob.type||'image/jpeg'}});
    p.remote=r.url;
  }
  return scan.photos.map(p=>p.remote);
}
async function readInvoice(){

  scan.step='reading';scan.error='';render();
  const myRun=(readAbort={cancelled:false});
  try{
    const urls=await uploadPhotos();
    if(myRun.cancelled)return;
    const r=await api('/api/read',{method:'POST',body:{photos:urls}});
    if(myRun.cancelled)return;
    if(!r||r.readable===false||!Array.isArray(r.lines)||!r.lines.length){scan.step='capture';scan.error=(r&&r.problem)?'This could not be read: '+r.problem+' Retake the photo or enter it by hand.':'No line items were found. Retake the photo in better light, or enter it by hand.';render();return}
    const sup=matchSupplier(r.supplier);
    scan.source='ai';
    if(scan.kind==='pricelist'&&scan.supplierId&&scan.supplierId!=='new'&&!sup)scan.draft=null;
    scan.draft={supplierId:sup?sup.id:(scan.kind==='pricelist'&&scan.supplierId?scan.supplierId:'new'),newSupplier:sup?'':(r.supplier||''),number:String(r.invoiceNumber||''),date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:todayISO(),printedTotal:num(r.invoiceTotal),
      lines:r.lines.map(fromRead).map(l=>({...l,qty:l.qty||'1'})).filter(l=>l.name),incomplete:!!r.incomplete,sections:r.sections||[]};
    if(r.incomplete)scan.error='This looks like only part of a longer invoice. Use “Add page and read again” to add the other page(s).';
    else if(r.reader?.issue)scan.error='Some lines may be wrong: '+r.reader.issue.replace('quantity × unitPrice does not equal lineTotal for','quantity × price does not match the invoice for')+'. Check the highlighted lines against the photo.';
    else if(r.reader?.backup)scan.error='Read with the backup reader because today’s free limit on the main reader was used up. Check each line carefully.';

function parsePaste(text){
  const out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    const row=raw.trim();if(!row)continue;
    let cells=row.includes('\t')?row.split('\t'):/[;,]/.test(row)&&!/\d,\d{2}\b/.test(row)?row.split(/[;,]/):row.split(/\s{2,}/);
    cells=cells.map(c=>c.trim()).filter(Boolean);
    if(cells.length===1)cells=row.split(/\s+/);
    const isNum=c=>/^£?\s*-?\d+(?:[.,]\d+)?$/.test(c.replace(/\s/g,''));
    const nums=cells.filter(isNum).map(c=>parseFloat(c.replace(/[£\s]/g,'').replace(',','.')));
    const texts=cells.filter(c=>!isNum(c));
    if(!nums.length||!texts.length)continue; // header or note
    let name,unit;
    if(cells.length>texts.length+nums.length-1&&texts.length>3){ // words split on single spaces: drop short codes, last word may be the unit
      const words=texts.filter((w,i)=>!(i===0&&/^[A-Z0-9]{1,5}$/.test(w)));
      const UNITS=/^(each|single|sgl|kg|g|l|ml|box|case|pack|packet|punnet|bag|bunch|tray|dozen|tub|jar|bottle|tin|can)$/i;
      unit=UNITS.test(words[words.length-1])?words.pop():'each';name=words.join(' ');
    }else{
      const t2=texts.filter((w,i)=>!(i===0&&texts.length>1&&/^[A-Z0-9]{1,6}$/.test(w)));
      name=t2[0]||texts[0];unit=t2.find(t=>t!==name)||'each';
    }
    let qty=1,price=nums[nums.length-1];
    if(nums.length>=3){const [a,b,c]=nums.slice(-3);if(Math.abs(a*b-c)<0.05){qty=a;price=b}else{qty=nums[0];price=nums[1]}}
    else if(nums.length===2){qty=nums[0];price=nums[1]}
    out.push({name,unit,qty:String(qty),price:String(round2(price))});
  }
  return out;
}

async function saveInvoice(){
  const d=scan.draft;
  const lines=d.lines.map(toSave).filter(l=>l.name&&(scan.kind==='pricelist'||l.qty>0));
  if(d.supplierId==='new'&&!(d.newSupplier||'').trim()){toast('Add the supplier name.');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')){toast('Add the invoice date.');return}
  if(!lines.length){toast('Add at least one product line.');return}
  const zero=lines.filter(l=>l.price===0).length;lines.splice(0,lines.length,...lines.filter(l=>l.price!==0));
  if(!lines.length){toast('Add at least one product line.');return}
  if(lines.some(l=>!l.other&&!(l.price>0))){toast('A product line needs a price. Tick “Credit” for money off.');return}
  if(zero)toast(`${zero} free (£0) line${zero>1?'s':''} left out.`);
  scan.step='saving';scan.error='';render();
  try{
    let photos=[];
    if(scan.photos.length){try{photos=await uploadPhotos()}catch(e){if(!confirmNoPhoto){scan.step='review';scan.error='The photo could not be uploaded ('+e.message+'). Tap Save again to save the invoice without its photo.';confirmNoPhoto=true;render();return}}}
    const r=await api('/api/invoices',{method:'POST',body:{supplierId:d.supplierId,newSupplier:d.newSupplier,number:d.number,date:d.date,printedTotal:d.printedTotal,lines,photos,historic:!!scan.importKey||!!scan.driveHistoric,sourceFile:scan.importKey||(scan.driveFileId?'drive:'+scan.driveFileId:undefined),driveFileId:scan.driveFileId||undefined,source:scan.kind==='pricelist'?'pricelist':scan.source,allowDuplicate:!!d.dupOk}});
    scan.photos.forEach(p=>URL.revokeObjectURL(p.url));confirmNoPhoto=false;
    const ik=scan.importKey,dk=scan.driveFileId;
    if(dk){scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';toast('Saved.');load();drvLoad();return}
    scan={step:'done',photos:[],draft:null,error:'',source:'ai',result:{...r,kind:scan.kind}};
    if(ik){const it=IMP.items.find(x=>x.key===ik);if(it){it.status='saved';it.msg=`${r.supplier} · ${money(r.total)}`}scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';toast('Saved. Next one to check is below.');load();return}
    render();load();
  }catch(e){
    scan.step='review';
    if(e.code==='DUP'){d.dupOk=true;scan.error=e.message+' Tap Save again only if this really is a different invoice.'}
    else scan.error=e.message;
    render();
  }
}

function productChart(h){

  const W=600,H=200,L=52,R=14,T=14,B=28;const vals=h.map(x=>x.p);let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*.25||mx*.1||1;mn=Math.max(0,mn-pad);mx=mx+pad;

  let g='';[0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${esc(money(v))}</text>`});

  g+=`<polygon class="ar" fill="currentColor" points="${L},${H-B} ${pts} ${X(h.length-1)},${H-B}"/><polyline class="ln" points="${pts}"/>`;
  const step=Math.ceil(h.length/6);
  h.forEach((x,i)=>{g+=`<circle class="dot ${i===h.length-1?'last':''}" cx="${X(i)}" cy="${Y(x.p)}" r="${i===h.length-1?5:3.5}"><title>${fmtDate(x.d)}: ${money(x.p)}</title></circle>`;if(i%step===0||i===h.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===h.length-1?'end':'middle'}">${esc(fmtShort(x.d))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history chart">${g}</svg>`;
}
