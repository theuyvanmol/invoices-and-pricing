<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoices">
<meta name="description" content="Scan supplier invoices and track every price your restaurant pays.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Invoices &amp; Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = slim sidebar + content column; phone = top bar + content + fixed bottom tab bar with a raised Scan button. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#eceeea; --line:#dfe2dc; --ink:#18201d; --ink-2:#4b5651; --muted:#76817b;
  --accent:#1d5c7a; --accent-ink:#ffffff; --accent-soft:#e2edf2;
  --up:#c23f2a; --up-soft:#fbe9e5; --down:#2c7a4b; --down-soft:#e3f2e8; --warn:#9a6512; --warn-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(24,32,29,.06),0 6px 22px rgba(24,32,29,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191e1c; --surface-2:#222826; --line:#2e3532; --ink:#eef1ee; --ink-2:#bcc5c0; --muted:#8c9791;
  --accent:#6fb3d4; --accent-ink:#0d1a21; --accent-soft:#1b2d36;
  --up:#ff8a74; --up-soft:#3a1f1a; --down:#74c995; --down-soft:#1a2f22; --warn:#e7b25a; --warn-soft:#33281a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191e1c; --surface-2:#222826; --line:#2e3532; --ink:#eef1ee; --ink-2:#bcc5c0; --muted:#8c9791;
  --accent:#6fb3d4; --accent-ink:#0d1a21; --accent-soft:#1b2d36;
  --up:#ff8a74; --up-soft:#3a1f1a; --down:#74c995; --down-soft:#1a2f22; --warn:#e7b25a; --warn-soft:#33281a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{padding-bottom:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:750}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.brand b{font-family:var(--f-display);font-size:17px;line-height:1.05;display:block}
.brand small{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:0;border-radius:10px;background:none;text-align:left;color:var(--ink-2);font-weight:600}
.navbtn:hover{background:var(--surface-2)}
.navbtn.on{background:var(--accent-soft);color:var(--ink)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn .count{margin-left:auto}
.side .scanbig{margin:8px 0 14px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
.topbar{display:none}
.tabbar{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.pagehead p{color:var(--muted);margin-top:4px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:650;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--up);border-color:var(--up-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.field{width:100%;min-width:0;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.field{appearance:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 200px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;font-family:var(--f-mono)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.flat{background:var(--surface-2);color:var(--muted)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.count{min-width:22px;height:22px;border-radius:99px;background:var(--up);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-family:var(--f-mono)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 10px}
.panel-b{padding:0 18px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.kpi .v{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:12px}
.kpi.alert .v{color:var(--up)}
button.kpi{cursor:pointer;color:inherit}
button.kpi:hover{border-color:var(--accent)}

.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);margin-bottom:16px;border:1px solid var(--line);background:var(--surface)}
.banner.alert{background:var(--up-soft);border-color:transparent}
.banner.alert b{color:var(--up)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1 1 220px;min-width:0}

/* Rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .t{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;min-width:0}
.row .r{text-align:right}
.price{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:12px}

/* Product table (desktop) */
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--surface-2)}
table.list .num{text-align:right;white-space:nowrap}
.cards{display:none}

/* Alerts */
.alertcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:16px 18px;border-top:1px solid var(--line)}
.alertcard:first-child{border-top:0}
.alertcard .big{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--up);text-align:right}
.alertcard .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.alertcard.done .big{color:var(--muted)}
.fromto{font-family:var(--f-mono);font-size:14px;margin-top:4px}
.fromto s{color:var(--muted)}
.note{margin-top:6px;font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:8px}

/* Bars & charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .bar{fill:var(--accent);opacity:.82}
.chart .bar.cur{opacity:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.share{display:grid;gap:12px}
.share-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
.meter{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:9px}

/* Scan */
.scan-hero{display:grid;gap:14px;padding:22px;text-align:center;justify-items:center}
.cam{display:grid;place-items:center;gap:6px;width:100%;max-width:420px;padding:28px 16px;border-radius:18px;border:2px dashed var(--line);background:var(--surface-2);position:relative;cursor:pointer}
.cam:hover{border-color:var(--accent)}
.cam svg{width:44px;height:44px;color:var(--accent)}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cam b{font-family:var(--f-display);font-size:19px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%;max-width:520px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.thumb .pg{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px;font-family:var(--f-mono)}
.addpage{display:grid;place-items:center;aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-size:13px;font-weight:600;position:relative;text-align:center;padding:6px}
.addpage input{position:absolute;inset:0;opacity:0;width:100%}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reviewgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.photostrip{display:grid;gap:10px}
.photostrip img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.form2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fl{display:grid;gap:5px;min-width:0}
.fl>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,1fr) 40px;gap:8px;padding:12px 0;border-top:1px solid var(--line);align-items:end}
.line .cmp{grid-column:1/-1;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line .x{min-height:44px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:10px}
.line .x:hover{background:var(--up-soft);color:var(--up)}
.totals{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:2px solid var(--ink);margin-top:4px}
.totals .price{font-size:22px}
.savebar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.result{display:grid;gap:12px;justify-items:center;text-align:center;padding:28px 18px}
.tick{width:58px;height:58px;border-radius:50%;background:var(--down-soft);color:var(--down);display:grid;place-items:center}
.tick svg{width:30px;height:30px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,16,14,.5);padding:16px}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.closex{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.fact{background:var(--surface-2);border-radius:11px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-mono);font-size:17px;margin-top:3px}
.invoice-photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:10px}
.empty{padding:36px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.notice{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.howto{display:grid;gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.howto li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.howto li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-mono)}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:760px}
.choice{display:grid;gap:6px;justify-items:center;align-content:center;text-align:center;padding:26px 16px;border-radius:18px;border:2px dashed var(--line);background:var(--surface-2);position:relative;cursor:pointer;color:var(--ink);font:inherit;min-height:170px}
.choice:hover{border-color:var(--accent)}
.choice svg{width:40px;height:40px;color:var(--accent)}
.choice b{font-family:var(--f-display);font-size:18px}
.choice input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.choice.solid{border-style:solid}
.pdfthumb{display:grid;place-items:center;height:100%;font-family:var(--f-mono);font-weight:600;color:var(--accent);background:var(--accent-soft)}
.pdfview{width:100%;height:70vh;min-height:420px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pastebox{display:grid;gap:8px;margin-top:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.pastebox textarea{min-height:120px;font-family:var(--f-mono);font-size:13px;resize:vertical}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface)}
@media (max-width:640px){.choices{grid-template-columns:1fr}.choice{min-height:120px;padding:18px 14px}}
.progress{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.improw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.improw:first-child{border-top:0}
.improw .fn{font-family:var(--f-mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.improw .acts{display:flex;gap:6px}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bigbtn{min-height:54px;font-size:16px}
@media (max-width:860px){.improw{padding:12px 14px}.improw .acts{flex-wrap:wrap}.kpis .kpi .v{font-size:20px}}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.reviewgrid{grid-template-columns:minmax(0,1fr)}.photostrip{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  .topbar .brand-mark{width:30px;height:30px;font-size:12px}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
  .iconbtn svg{width:20px;height:20px}
  main{padding-block:18px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pagehead{margin-bottom:16px}
  .pagehead .hide-m{display:none}

.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;overflow:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

        <button class="iconbtn" data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>

    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-card" id="sheetCard"></div></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9ก-๙]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso+'T12:00:00');return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtShort=iso=>{const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const round2=n=>Math.round(n*100)/100;

const I={
 import:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3 3 3-3"/></svg>',
 pricelist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
 scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 alerts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
 invoices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
 suppliers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/></svg>',
 compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0z"/><path d="M19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></svg>',
 settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 gallery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>'
};
const VIEWS={home:'Overview',import:'Import many invoices',pricelist:'Supplier price list',products:'Products & prices',compare:'Compare suppliers',scan:'Add invoice',alerts:'Price alerts',invoices:'Invoices',suppliers:'Suppliers',settings:'Settings'};
const SUBS={import:'Bring in a whole folder of old invoices at once. Each one is read and saved automatically. Anything unclear waits for you under Needs checking.',home:'Everything you are paying, updated from every invoice your managers scan.',pricelist:'Every supplier, the products you buy from them and the current price per unit.',products:'Latest and previous price for every product from every supplier.',compare:'The same product from different suppliers, cheapest first.',scan:'Take a photo, upload a photo or PDF, or type it in. You check everything before it is saved.',alerts:'Every price increase found on an invoice, waiting for your review.',invoices:'Every scanned invoice with its photo, searchable by supplier and number.',suppliers:'Who you buy from and how their prices are moving.',settings:'Alert rules, email, PINs and how your team uses the app.'};

/* ---------- state ---------- */
const S={sup:[],prod:[],inv:[],alerts:[],settings:{threshold:0,currency:'£',restaurant:'Geisha Restaurant',alertEmail:'',pinsEnabled:false},loaded:{},err:null,slow:false,noDb:false,role:null,features:{}};
const isOwner=()=>S.role==='owner';
const UI={pq:'',psup:'all',pfilter:'all',psort:'name',iq:'',isup:'all',afilter:'open',cq:''};
let scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};
const MAX_PAGES=5;

const cur=()=>'£';
const money=n=>{const v=Number(n||0);return (v<0?'−':'')+cur()+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const supName=id=>S.sup.find(s=>s.id===id)?.name||'Unknown supplier';
const sortedHist=p=>[...(p.history||[])].sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.t||0)-(b.t||0));
const latest=p=>{const h=sortedHist(p);return h.length?h[h.length-1]:null};
const previous=p=>{const h=sortedHist(p);return h.length>1?h[h.length-2]:null};
const change=p=>{const l=latest(p),pr=previous(p);if(!l||!pr||!pr.p)return null;const d=round2(l.p-pr.p);return {diff:d,pct:d/pr.p*100}};
const realInv=()=>S.inv.filter(i=>i.source!=='pricelist');
const openAlerts=()=>S.alerts.filter(a=>a.status!=='reviewed');
const view=()=>{const v=(location.hash||'').slice(1);return VIEWS[v]?v:'home'};

function pill(c){if(!c)return '<span class="pill new">New</span>';if(c.diff>0.004)return `<span class="pill up">▲ ${c.pct.toFixed(1)}%</span>`;if(c.diff<-0.004)return `<span class="pill down">▼ ${Math.abs(c.pct).toFixed(1)}%</span>`;return '<span class="pill flat">No change</span>'}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3600)}

let renderQueued=false;
function schedule(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}

/* ---------- server ---------- */
async function api(path,opts={}){
  const o={method:opts.method||'GET',headers:{...(opts.headers||{})},credentials:'same-origin'};
  if(opts.body instanceof Blob){o.body=opts.body}else if(opts.body!==undefined){o.body=JSON.stringify(opts.body);o.headers['content-type']='application/json'}
  let r;
  try{r=await fetch(path,o)}catch(e){throw Object.assign(new Error('No connection. Check the internet and try again.'),{offline:true})}
  let data={};try{data=await r.json()}catch(e){}
  if(r.status===401&&data.code==='AUTH'){S.role=null;showGate();}
  if(!r.ok)throw Object.assign(new Error(data.error||'Something went wrong. Try again.'),{status:r.status,code:data.code});
  return data;
}
let loading=false;
async function load(){
  if(loading||!S.role)return;loading=true;
  if(!DRV.st&&!DRV.loading){DRV.loading=true;drvLoad().then(()=>{DRV.loading=false;if(DRV.st?.connected&&!DRV.lastAuto){DRV.lastAuto=Date.now();drvSync(false)}})}
  try{
    const d=await api('/api/data');
    S.sup=d.suppliers;S.prod=d.products;S.inv=d.invoices;S.alerts=d.alerts;S.settings={...S.settings,...d.settings};S.role=d.role;
    S.loaded.prod=true;S.err=null;S.slow=false;
  }catch(e){if(e.status!==401)S.err=e.message}
  finally{loading=false;schedule()}
}
setInterval(()=>{if(document.visibilityState==='visible'&&S.role&&scan.step!=='review')load()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});

/* ---------- sign in ---------- */
let pin='';
function gateBrand(){return `<div class="brand"><div class="brand-mark">I&amp;P</div><div><b>Invoices &amp; Pricing</b><small>${esc(S.settings.restaurant||'Supplier price control')}</small></div></div>`}
function showGate(msg=''){
  const g=$('#gate');g.hidden=false;
  if(S.noDb){g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Almost ready</h1><p>The database is not connected yet. In Vercel, open this project → Storage → Create Database → Neon, connect it, then redeploy.</p><button class="btn" onclick="location.reload()">Check again</button></div>`;return}
  if(S.needsSetup){g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Set up your app</h1><p>Choose two PINs. You keep the owner PIN. Give the manager PIN to the people who scan invoices.</p>
  <form id="setupForm"><label class="fl"><span>Restaurant name</span><input class="field" id="suRest" autocomplete="organization" required maxlength="80"></label>
  <label class="fl"><span>Owner PIN (4–8 digits)</span><input class="field mono" id="suOwner" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="new-password" type="password" required></label>
  <label class="fl"><span>Manager PIN (4–8 digits)</span><input class="field mono" id="suMgr" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="off" required></label>
  
  <label class="fl"><span>Email for price alerts (optional)</span><input class="field" id="suEmail" type="email" autocomplete="email"></label>
  <div class="err" id="gateErr">${esc(msg)}</div><button class="btn primary" type="submit">Create app</button></form></div>`;
  $('#setupForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/session',{method:'POST',body:{action:'setup',restaurant:$('#suRest').value,ownerPin:$('#suOwner').value,managerPin:$('#suMgr').value,alertEmail:$('#suEmail').value}});S.needsSetup=false;S.role='owner';hideGate();toast('Your app is ready. Scan the first invoice.');load()}catch(err){$('#gateErr').textContent=err.message}};
  return}
  pin='';
  g.innerHTML=`<div class="gate-card">${gateBrand()}<h1>Enter your PIN</h1><p>Owner or manager PIN</p><div class="pinrow" id="pinDots"></div><div class="err" id="gateErr">${esc(msg)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}<button class="ghostkey" data-key="clear">Clear</button><button data-key="0">0</button><button class="ghostkey" data-key="ok">Enter</button></div></div>`;
  dots();
}
function dots(){const el=$('#pinDots');if(el)el.innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<span class="${i<pin.length?'on':''}"></span>`).join('')}
async function tryLogin(){
  if(pin.length<4)return;const p=pin;pin='';dots();
  try{const r=await api('/api/session',{method:'POST',body:{action:'login',pin:p}});S.role=r.role;hideGate();load()}
  catch(e){$('#gateErr').textContent=e.message}
}
$('#gate').addEventListener('click',e=>{
  const k=e.target.closest('[data-key]')?.dataset.key;if(!k)return;
  if(k==='clear'){pin=''}else if(k==='ok'){tryLogin();return}else if(pin.length<8){pin+=k}
  $('#gateErr').textContent='';dots();
});
document.addEventListener('keydown',e=>{if($('#gate').hidden||S.needsSetup||S.noDb)return;if(/^\d$/.test(e.key)&&pin.length<8){pin+=e.key;dots()}else if(e.key==='Backspace'){pin=pin.slice(0,-1);dots()}else if(e.key==='Enter')tryLogin()});
function hideGate(){$('#gate').hidden=true;$('#gate').innerHTML='';render()}
async function boot(){
  render();
  try{
    const s=await api('/api/session');
    S.features=s.features||{};
    if(s.error==='NO_DB'){S.noDb=true;showGate();return}
    S.needsSetup=!!s.needsSetup;S.settings={...S.settings,...(s.settings||{})};S.role=s.role;
    if(!S.role)showGate();else{load()}
  }catch(e){S.err=e.message;render()}
}
async function signOut(){try{await api('/api/session',{method:'POST',body:{action:'logout'}})}catch(e){}S.role=null;S.sup=[];S.prod=[];S.inv=[];S.alerts=[];S.loaded={};showGate()}

/* ---------- navigation ---------- */
const NAV=['home','pricelist','products','compare','scan','alerts','invoices','import','suppliers','settings'];
function renderNav(){
  const v=view(),n=openAlerts().length;
  $('#sideNav').innerHTML=NAV.filter(k=>k!=='scan').map(k=>`<button class="navbtn ${v===k?'on':''}" data-go="${k}">${I[k]}${k==='pricelist'?'Price list':k==='products'?'All products':k==='import'?'Import many':VIEWS[k]}${k==='alerts'&&n?`<span class="count">${n}</span>`:''}</button>`).join('');
  const tabs=[['home','Home'],['pricelist','Prices'],['scan','Scan'],['alerts','Alerts'],['invoices','Invoices']];
  $('#tabbar').innerHTML=tabs.map(([k,l])=>k==='scan'?`<button class="tab scan ${v===k?'on':''}" data-go="scan" aria-label="Scan invoice"><span class="fab">${I.scan}</span>${l}</button>`:`<button class="tab ${v===k?'on':''}" data-go="${k}">${I[k]}${l}${k==='alerts'&&n?`<span class="count">${n}</span>`:''}</button>`).join('');
  const role=isOwner()?'Owner':'Manager';

function spendChart(){
  const weeks=[];const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);mon.setHours(0,0,0,0);
  for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-i*7);const e=new Date(s);e.setDate(s.getDate()+7);weeks.push({s,e,v:0})}
  realInv().forEach(inv=>{const d=new Date((inv.date||'')+'T12:00:00');const w=weeks.find(w=>d>=w.s&&d<w.e);if(w)w.v+=num(inv.total)});
  const max=Math.max(...weeks.map(w=>w.v));if(!max)return '<p class="muted small">Spend appears here once invoices are scanned.</p>';
  const nice=niceMax(max),W=560,H=190,L=48,R=10,T=10,B=26,bw=(W-L-R)/weeks.length;
  let g='';[0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${esc(cur()+Math.round(nice*f).toLocaleString('en-GB'))}</text>`});
  weeks.forEach((w,i)=>{const hh=(H-T-B)*(w.v/nice),x=L+i*bw+bw*.18,y=H-B-hh;g+=`<rect class="bar ${i===7?'cur':''}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(hh,w.v?2:0)}" rx="4" fill="currentColor"><title>Week of ${fmtShort(w.s.toISOString().slice(0,10))}: ${money(w.v)}</title></rect><text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${i===7?'This wk':fmtShort(w.s.toISOString().slice(0,10))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly spend for the last 8 weeks">${g}</svg>`;
}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

/* one row per product with its current price, plus the cheapest matching product at another supplier */
function priceRows(supplierId){
  return S.prod.filter(p=>p.supplierId===supplierId).map(p=>{
    const l=latest(p),pr=previous(p),c=change(p);
    const key=norm(p.name)+'|'+norm(p.unit);
    const others=S.prod.filter(o=>o.supplierId!==supplierId&&norm(o.name)+'|'+norm(o.unit)===key).map(o=>({o,l:latest(o)})).filter(z=>z.l).sort((a,b)=>a.l.p-b.l.p);
    return {p,l,pr,c,best:others[0]||null};
  }).sort((a,b)=>a.p.name.localeCompare(b.p.name));
}
function elsewhere(x){
  if(!x.best||!x.l)return '';
  const d=round2(x.l.p-x.best.l.p);
  if(d>0.004)return `<span class="pill warn">${money(d)} cheaper at ${esc(supName(x.best.o.supplierId))}</span>`;
  if(d<-0.004)return `<span class="pill down">Cheapest</span>`;

async function drvSync(untilDone){
  if(DRV.busy||!DRV.st?.connected)return;

      const r=await api('/api/drive',{method:'POST',body:{action:'sync'}});

const impKey=f=>`${f.webkitRelativePath||f.name}|${f.size}`;
const isPdfFile=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
const isImgFile=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name);
function impAdd(files){
  const done=new Set(S.inv.map(i=>i.sourceFile).filter(Boolean)),have=new Set(IMP.items.map(x=>x.key));
  let added=0,skipped=0,ignored=0;
  [...files].sort((a,b)=>(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,undefined,{numeric:true})).forEach(f=>{
    if(!isPdfFile(f)&&!isImgFile(f)){ignored++;return}
    const key=impKey(f);if(have.has(key))return;have.add(key);
    if(done.has(key)){IMP.items.push({key,file:f,status:'skipped',msg:'Already imported'});skipped++;return}
    if(isPdfFile(f)&&f.size>4*1024*1024){IMP.items.push({key,file:f,status:'failed',msg:'PDF is over 4 MB'});return}
    IMP.items.push({key,file:f,status:'waiting',msg:''});added++;
  });
  toast(`${added} file${added===1?'':'s'} ready${skipped?`, ${skipped} already imported`:''}${ignored?`, ${ignored} ignored (not a photo or PDF)`:''}.`);
  render();
}

function impProblem(r,d){

  const sum=round2(d.lines.reduce((a,l)=>a+num(l.qty)*num(l.price),0));
  const totals=[d.subtotal,d.printedTotal].filter(t=>t>0);
  if(totals.length&&!totals.some(t=>Math.abs(t-sum)<=0.05))return `Lines add up to ${money(sum)} but the invoice says ${money(totals[totals.length-1])}`;

}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let impLock=null;
async function impRun(){
  if(IMP.running)return;
  IMP.running=true;IMP.stop=false;IMP.note='';render();
  try{impLock=await navigator.wakeLock?.request('screen')}catch(e){}
  let lastRead=0,limitHits=0;
  while(!IMP.stop){
    const it=IMP.items.find(x=>x.status==='waiting');if(!it)break;
    it.status='reading';it.msg='';schedule();
    try{
      if(!it.photo){
        const blob=isPdfFile(it.file)?(it.file.type?it.file:new Blob([it.file],{type:'application/pdf'})):await shrink(it.file);
        const up=await api('/api/upload',{method:'POST',body:blob,headers:{'content-type':'application/octet-stream','x-file-type':blob.type||'image/jpeg'}});
        it.photo=up.url;
      }
      const gap=6500-(Date.now()-lastRead);if(gap>0)await sleep(gap);
      lastRead=Date.now();
      const r=await api('/api/read',{method:'POST',body:{photos:[it.photo]}});
      limitHits=0;
      const d=impDraft(r);it.draft=d;
      const why=impProblem(r,d);
      if(why){it.status='check';it.msg=why;continue}
      const saved=await api('/api/invoices',{method:'POST',body:{supplierId:d.supplierId,newSupplier:d.newSupplier,number:d.number,date:d.date,printedTotal:d.printedTotal,lines:d.lines.map(l=>({name:l.name,unit:l.unit,qty:num(l.qty),price:round2(num(l.price))})),photos:[it.photo],source:'ai',historic:true,sourceFile:it.key}});
      it.status='saved';it.msg=`${saved.supplier} · ${d.date} · ${money(saved.total)}`;
      if(!S.sup.some(x=>x.name===saved.supplier))await load();
    }catch(e){
      if(e.code==='DUP'){it.status='skipped';it.msg='Already saved (same supplier and invoice number)'}
      else if(/limit|busy/i.test(e.message)||e.status===503){
        it.status='waiting';limitHits++;
        if(limitHits>=4){IMP.note='Google\'s free reading limit seems to be used up for today. Come back tomorrow, open Import many, choose the same folder and press Start. Finished files are skipped.';break}
        IMP.note=`Google is busy or the per-minute limit was reached. Waiting a minute, then carrying on (try ${limitHits} of 3).`;schedule();await sleep(65000);IMP.note='';
      }
      else if(e.offline){it.status='waiting';IMP.note='No internet connection. Import paused. Press Start when you are back online.';break}
      else{it.status='failed';it.msg=e.message}
    }
    schedule();
  }
  IMP.running=false;try{impLock?.release()}catch(e){}impLock=null;
  load();render();
  const c=impCounts();if(!c.waiting&&!IMP.note)toast(`Import finished: ${c.saved} saved, ${c.check} to check.`);
}
function impCounts(){const c={waiting:0,reading:0,saved:0,check:0,skipped:0,failed:0};IMP.items.forEach(x=>c[x.status]++);return c}
function impCheck(key){

}

function matchSupplier(name){const n=norm(name);if(!n)return null;return S.sup.find(s=>norm(s.name)===n)||S.sup.find(s=>{const m=norm(s.name);return m.length>3&&(n.includes(m)||m.includes(n))})||null}
function matchProduct(supplierId,name){const n=norm(name);if(!n||!supplierId||supplierId==='new')return null;return S.prod.find(p=>p.supplierId===supplierId&&norm(p.name)===n)||null}
function lastBefore(p,date){const h=sortedHist(p).filter(x=>(x.d||'')<=(date||'9999'));return h.length?h[h.length-1]:null}

function cmpHTML(l){
  const d=scan.draft;const p=matchProduct(d.supplierId,l.name);
  if(!l.name.trim())return '<span class="muted">Enter a product name</span>';
  if(!p)return `<span class="pill new">New product</span><span class="muted">Price history starts with this invoice.</span>`;
  const pr=lastBefore(p,d.date);if(!pr)return '<span class="pill new">First price</span>';
  const unitWarn=norm(p.unit)!==norm(l.unit)?` <span class="pill warn">Unit was ${esc(p.unit)}</span>`:'';
  const diff=round2(num(l.price)-pr.p),pct=pr.p?diff/pr.p*100:0;
  if(diff>0.004)return `<span class="pill up">▲ +${money(diff)} (${pct.toFixed(1)}%)</span><span class="muted">Last paid ${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
  if(diff<-0.004)return `<span class="pill down">▼ ${money(diff)} (${pct.toFixed(1)}%)</span><span class="muted">Last paid ${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
  return `<span class="pill flat">Same as last time</span><span class="muted">${money(pr.p)} on ${fmtShort(pr.d)}</span>${unitWarn}`;
}

function lineHTML(l,i){return `<div class="line" data-line="${i}"><label class="fl nm"><span>Product</span><input class="field" data-lf="name" value="${esc(l.name)}" list="prodNames"></label><label class="fl"><span>Qty</span><input class="field mono" data-lf="qty" inputmode="decimal" value="${esc(l.qty)}"></label><label class="fl"><span>Unit</span><input class="field" data-lf="unit" value="${esc(l.unit)}" placeholder="kg"></label><label class="fl"><span>Price / unit</span><input class="field mono" data-lf="price" inputmode="decimal" value="${esc(l.price)}"></label><button class="x" data-rmline="${i}" aria-label="Remove line">×</button><div class="cmp">${cmpHTML(l)}</div></div>`}

async function shrink(file){
  try{
    const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const m=1800,sc=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));return b||file;
  }catch(e){return file}
}
async function addPhotos(files){
  const max=MAX_PAGES;
  for(const f of files){if(scan.photos.length>=max){toast(`Up to ${max} pages per invoice.`);break}const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);if(isPdf){if(f.size>4*1024*1024){toast('That PDF is over 4 MB. Save it smaller or take a photo instead.');continue}const b=f.type?f:new Blob([f],{type:'application/pdf'});scan.photos.push({blob:b,url:URL.createObjectURL(b),pdf:true});continue}if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|heic|webp)$/i.test(f.name)){toast('Choose a photo (JPG or PNG) or a PDF.');continue}const b=await shrink(f);scan.photos.push({blob:b,url:URL.createObjectURL(b)})}
  scan.error='';render();
}

let readAbort=null;
async function uploadPhotos(){
  for(const p of scan.photos){
    if(p.remote)continue;
    const r=await api('/api/upload',{method:'POST',body:p.blob,headers:{'content-type':'application/octet-stream','x-file-type':p.blob.type||'image/jpeg'}});
    p.remote=r.url;
  }
  return scan.photos.map(p=>p.remote);
}
async function readInvoice(){
  if(S.features.ai===false){scan.error='Automatic reading is not switched on yet. Enter the invoice by hand.';startManual();return}
  scan.step='reading';scan.error='';render();
  const myRun=(readAbort={cancelled:false});
  try{
    const urls=await uploadPhotos();
    if(myRun.cancelled)return;
    const r=await api('/api/read',{method:'POST',body:{photos:urls}});
    if(myRun.cancelled)return;
    if(!r||r.readable===false||!Array.isArray(r.lines)||!r.lines.length){scan.step='capture';scan.error=(r&&r.problem)?'This could not be read: '+r.problem+' Retake the photo or enter it by hand.':'No line items were found. Retake the photo in better light, or enter it by hand.';render();return}
    const sup=matchSupplier(r.supplier);
    scan.source='ai';
    if(scan.kind==='pricelist'&&scan.supplierId&&scan.supplierId!=='new'&&!sup)scan.draft=null;
    scan.draft={supplierId:sup?sup.id:(scan.kind==='pricelist'&&scan.supplierId?scan.supplierId:'new'),newSupplier:sup?'':(r.supplier||''),number:String(r.invoiceNumber||''),date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:todayISO(),printedTotal:num(r.invoiceTotal),
      lines:r.lines.map(l=>({name:String(l.name||'').trim(),unit:String(l.unit||'each').trim(),qty:String(num(l.quantity)||1),price:String(round2(num(l.unitPrice)||(num(l.lineTotal)&&num(l.quantity)?num(l.lineTotal)/num(l.quantity):0)))})).filter(l=>l.name)};
    scan.step='review';lastView=null;render();
  }catch(e){
    if(myRun.cancelled)return;
    scan.step='capture';scan.error=e.message;render();
  }
}
function startManual(){

  scan.draft={supplierId:scan.kind==='pricelist'?(scan.supplierId||'new'):(S.sup[0]?.id||'new'),newSupplier:'',number:'',date:todayISO(),printedTotal:0,lines:[{name:'',unit:'',qty:'1',price:''}]};
  scan.step='review';render();
}

function parsePaste(text){
  const out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    const row=raw.trim();if(!row)continue;
    let cells=row.includes('\t')?row.split('\t'):/[;,]/.test(row)&&!/\d,\d{2}\b/.test(row)?row.split(/[;,]/):row.split(/\s{2,}/);
    cells=cells.map(c=>c.trim()).filter(Boolean);
    if(cells.length===1)cells=row.split(/\s+/);
    const isNum=c=>/^£?\s*-?\d+(?:[.,]\d+)?$/.test(c.replace(/\s/g,''));
    const nums=cells.filter(isNum).map(c=>parseFloat(c.replace(/[£\s]/g,'').replace(',','.')));
    const texts=cells.filter(c=>!isNum(c));
    if(!nums.length||!texts.length)continue; // header or note
    let name,unit;
    if(cells.length>texts.length+nums.length-1&&texts.length>3){ // words split on single spaces: drop short codes, last word may be the unit
      const words=texts.filter((w,i)=>!(i===0&&/^[A-Z0-9]{1,5}$/.test(w)));
      const UNITS=/^(each|single|sgl|kg|g|l|ml|box|case|pack|packet|punnet|bag|bunch|tray|dozen|tub|jar|bottle|tin|can)$/i;
      unit=UNITS.test(words[words.length-1])?words.pop():'each';name=words.join(' ');
    }else{
      const t2=texts.filter((w,i)=>!(i===0&&texts.length>1&&/^[A-Z0-9]{1,6}$/.test(w)));
      name=t2[0]||texts[0];unit=t2.find(t=>t!==name)||'each';
    }
    let qty=1,price=nums[nums.length-1];
    if(nums.length>=3){const [a,b,c]=nums.slice(-3);if(Math.abs(a*b-c)<0.05){qty=a;price=b}else{qty=nums[0];price=nums[1]}}
    else if(nums.length===2){qty=nums[0];price=nums[1]}
    out.push({name,unit,qty:String(qty),price:String(round2(price))});
  }
  return out;
}
function supplierProductLines(supId){
  return S.prod.filter(p=>p.supplierId===supId).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>({name:p.name,unit:p.unit,qty:'',price:latest(p)?String(latest(p).p):''}));
}
function fillFromKnown(i){
  const l=scan.draft.lines[i];if(!l)return;
  const p=matchProduct(scan.draft.supplierId,l.name);if(!p)return;
  const el=document.querySelector(`#dLines .line[data-line="${i}"]`);
  if(p.unit&&(!l.unit||l.unit==='kg')){l.unit=p.unit;const u=el?.querySelector('[data-lf="unit"]');if(u)u.value=p.unit}
  const lp=latest(p);if(lp&&!l.price){l.price=String(lp.p);const pr=el?.querySelector('[data-lf="price"]');if(pr)pr.value=l.price}
  refreshCmp();
}

async function saveInvoice(){
  const d=scan.draft;
  const lines=d.lines.map(l=>({name:l.name.trim(),unit:(l.unit||'each').trim(),qty:num(l.qty),price:round2(num(l.price))})).filter(l=>l.name&&(scan.kind==='pricelist'||l.qty>0));
  if(d.supplierId==='new'&&!(d.newSupplier||'').trim()){toast('Add the supplier name.');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')){toast('Add the invoice date.');return}
  if(!lines.length){toast('Add at least one product line.');return}
  if(lines.some(l=>!(l.price>0))){toast('Every line needs a price above zero.');return}
  scan.step='saving';scan.error='';render();
  try{
    let photos=[];
    if(scan.photos.length){try{photos=await uploadPhotos()}catch(e){if(!confirmNoPhoto){scan.step='review';scan.error='The photo could not be uploaded ('+e.message+'). Tap Save again to save the invoice without its photo.';confirmNoPhoto=true;render();return}}}
    const r=await api('/api/invoices',{method:'POST',body:{supplierId:d.supplierId,newSupplier:d.newSupplier,number:d.number,date:d.date,printedTotal:d.printedTotal,lines,photos,historic:!!scan.importKey||!!scan.driveHistoric,sourceFile:scan.importKey||(scan.driveFileId?'drive:'+scan.driveFileId:undefined),driveFileId:scan.driveFileId||undefined,source:scan.kind==='pricelist'?'pricelist':scan.source,allowDuplicate:!!d.dupOk}});
    scan.photos.forEach(p=>URL.revokeObjectURL(p.url));confirmNoPhoto=false;
    const ik=scan.importKey,dk=scan.driveFileId;
    if(dk){scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';toast('Saved.');load();drvLoad();return}
    scan={step:'done',photos:[],draft:null,error:'',source:'ai',result:{...r,kind:scan.kind}};
    if(ik){const it=IMP.items.find(x=>x.key===ik);if(it){it.status='saved';it.msg=`${r.supplier} · ${money(r.total)}`}scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';toast('Saved. Next one to check is below.');load();return}
    render();load();
  }catch(e){
    scan.step='review';
    if(e.code==='DUP'){d.dupOk=true;scan.error=e.message+' Tap Save again only if this really is a different invoice.'}
    else scan.error=e.message;
    render();
  }
}

function openSheet(html){$('#sheetCard').innerHTML=html;$('#sheet').hidden=false;$('#sheetCard').scrollTop=0;document.body.style.overflow='hidden';setTimeout(()=>$('#sheetCard .closex')?.focus(),30)}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';$('#sheetCard').innerHTML=''}

function productChart(h){
  if(h.length<2)return '<p class="small muted">The chart appears after the second invoice for this product.</p>';
  const W=600,H=200,L=52,R=14,T=14,B=28;const vals=h.map(x=>x.p);let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*.25||mx*.1||1;mn=Math.max(0,mn-pad);mx=mx+pad;
  const X=i=>L+(W-L-R)*(i/(h.length-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';[0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${esc(money(v))}</text>`});
  const pts=h.map((x,i)=>`${X(i)},${Y(x.p)}`).join(' ');
  g+=`<polygon class="ar" fill="currentColor" points="${L},${H-B} ${pts} ${X(h.length-1)},${H-B}"/><polyline class="ln" points="${pts}"/>`;
  const step=Math.ceil(h.length/6);
  h.forEach((x,i)=>{g+=`<circle class="dot ${i===h.length-1?'last':''}" cx="${X(i)}" cy="${Y(x.p)}" r="${i===h.length-1?5:3.5}"><title>${fmtDate(x.d)}: ${money(x.p)}</title></circle>`;if(i%step===0||i===h.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===h.length-1?'end':'middle'}">${esc(fmtShort(x.d))}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history chart">${g}</svg>`;
}
function showProduct(id){
  const p=S.prod.find(x=>x.id===id);if(!p){toast('Product not found.');return}
  const h=sortedHist(p),l=latest(p),c=change(p);const vals=h.map(x=>x.p);
  const peers=S.prod.filter(x=>norm(x.name)===norm(p.name)&&norm(x.unit)===norm(p.unit)).map(x=>({x,l:latest(x)})).filter(z=>z.l).sort((a,b)=>a.l.p-b.l.p);
  openSheet(`<div class="sheet-h"><div><span class="label">${esc(supName(p.supplierId))}</span><h2 style="font-size:24px;margin-top:3px">${esc(p.name)}</h2><p class="muted small">Price per ${esc(p.unit)}</p></div><button class="closex" data-act="close" aria-label="Close">×</button></div>
  <div class="facts"><div class="fact"><span class="label">Latest</span><b>${l?money(l.p):'—'}</b><span class="small muted">${l?fmtShort(l.d):''}</span></div><div class="fact"><span class="label">Change</span><b style="color:${c&&c.diff>0.004?'var(--up)':c&&c.diff<-0.004?'var(--down)':'inherit'}">${c?(c.diff>0?'+':'')+money(c.diff):'—'}</b><span class="small">${pill(c)}</span></div><div class="fact"><span class="label">Range</span><b>${vals.length?money(Math.min(...vals)):'—'}</b><span class="small muted">to ${vals.length?money(Math.max(...vals)):'—'}</span></div></div>
  ${productChart(h)}
  ${peers.length>1?`<h3 style="margin:18px 0 6px">Other suppliers</h3><div class="rows">${peers.map((z,i)=>`<button class="row" data-product="${esc(z.x.id)}" style="padding-inline:0"><span class="t">${esc(supName(z.x.supplierId))}${z.x.id===p.id?' <span class="muted small">(this)</span>':''}</span><span class="r price">${money(z.l.p)}</span><span class="s">${fmtShort(z.l.d)}</span><span class="r">${i===0?'<span class="pill down">Cheapest</span>':`<span class="pill up">+${money(z.l.p-peers[0].l.p)}</span>`}</span></button>`).join('')}</div>`:''}
  <h3 style="margin:18px 0 6px">Full price history</h3><div class="tablewrap"><table class="list"><thead><tr><th>Date</th><th>Invoice</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Change</th></tr></thead><tbody>${h.slice().reverse().map((x,i,arr)=>{const pr=arr[i+1];const d=pr?round2(x.p-pr.p):null;const inv=S.inv.find(v=>v.id===x.inv);return `<tr ${inv?`data-invoice="${esc(inv.id)}"`:''}><td>${fmtDate(x.d)}</td><td class="mono small">${esc(inv?.number||'—')}</td><td class="num mono">${x.q??'—'}</td><td class="num price">${money(x.p)}</td><td class="num">${d==null?'<span class="pill new">First</span>':Math.abs(d)<0.005?'<span class="muted small">—</span>':`<span class="pill ${d>0?'up':'down'}">${d>0?'+':''}${money(d)}</span>`}</td></tr>`}).join('')}</tbody></table></div>`);
}
function showInvoice(id){
  const i=S.inv.find(x=>x.id===id);if(!i){toast('Invoice not found.');return}
  const ro=!isOwner();
  openSheet(`<div class="sheet-h"><div><span class="label">Invoice <span class="mono">${esc(i.number||'')}</span></span><h2 style="font-size:24px;margin-top:3px">${esc(supName(i.supplierId))}</h2><p class="muted small">${fmtDate(i.date)} · ${i.source==='manual'?'Entered by hand':'Scanned'}${i.demo?' · Example':''}</p></div><button class="closex" data-act="close" aria-label="Close">×</button></div>
  ${(i.photos||[]).map((a,n)=>/\.pdf(\?|$)/i.test(a)?`<p style="margin-bottom:10px"><a class="btn" href="${esc(a)}" target="_blank" rel="noopener">Open PDF invoice</a></p>`:`<a href="${esc(a)}" target="_blank" rel="noopener"><img class="invoice-photo" src="${esc(a)}" alt="Invoice photo page ${n+1}" loading="lazy"></a>`).join('')||'<p class="notice" style="margin-bottom:12px">No photo stored for this invoice.</p>'}
  <div class="tablewrap"><table class="list"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Line total</th></tr></thead><tbody>${(i.lines||[]).map(l=>{const a=S.alerts.find(x=>x.invoiceId===i.id&&x.productId===l.productId);return `<tr data-product="${esc(l.productId)}"><td><b>${esc(l.name)}</b> <span class="muted small">/${esc(l.unit)}</span>${a?` <span class="pill up">+${num(a.pct).toFixed(1)}%</span>`:''}</td><td class="num mono">${l.qty}</td><td class="num price">${money(l.price)}</td><td class="num mono">${money(l.qty*l.price)}</td></tr>`}).join('')}</tbody></table></div>
  <div class="totals"><b>Total</b><span class="price">${money(i.total)}</span></div>
  ${num(i.printedTotal)&&Math.abs(num(i.printedTotal)-num(i.total))>0.05?`<p class="small muted" style="margin-top:6px">Printed total ${money(i.printedTotal)} (may include VAT or delivery)</p>`:''}
  ${!ro?`<div class="savebar" id="delWrap"><button class="btn danger sm" data-askdel="${esc(i.id)}">Delete invoice</button></div>`:''}`);
}
function showSupplier(id){UI.lsup='all';UI.lq='';if(location.hash!=='#pricelist')location.hash='pricelist';else render();setTimeout(()=>document.getElementById('sup-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),120);}

async function deleteInvoice(id){
  try{await api('/api/invoices?id='+encodeURIComponent(id),{method:'DELETE'});closeSheet();toast('Invoice deleted and prices updated.');load()}
  catch(e){toast(e.message)}
}

/* ---------- render ---------- */
let lastView=null;
function render(){
  renderNav();
  const v=view();
  if(IMP.running&&v==='scan'&&scan.step==='review'&&document.getElementById('dLines'))return;
  if(v==='scan'&&(scan.step==='review')&&lastView==='scan'&&document.getElementById('dLines')){refreshCmp();return}
  const fn={home:vHome,import:vImport,pricelist:vPricelist,products:vProducts,compare:vCompare,scan:vScan,alerts:vAlerts,invoices:vInvoices,suppliers:vSuppliers,settings:vSettings}[v];
  const active=document.activeElement,aid=active&&active.id,pos=aid&&active.selectionStart;
  $('#main').innerHTML=fn()+`<datalist id="prodNames">${[...new Set(S.prod.map(p=>p.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.body){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  lastView=v;
}
function refreshCmp(){
  document.querySelectorAll('#dLines .line').forEach(el=>{const i=+el.dataset.line;const l=scan.draft.lines[i];if(l)el.querySelector('.cmp').innerHTML=cmpHTML(l)});
  const t=$('#dTot');if(t)t.textContent=money(draftTotal());
  const printed=num(scan.draft.printedTotal),mm=$('#dMismatch');if(mm)mm.innerHTML=printed>0&&Math.abs(printed-draftTotal())>0.05?'<p class="notice" style="margin-top:10px;color:var(--warn)">The lines do not add up to the printed total. VAT, delivery or a missed line can cause this. Check the photo.</p>':'';
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-drvcheck],[data-drvretry],[data-drvignore],[data-impf],[data-impcheck],[data-impretry],[data-go],[data-product],[data-invoice],[data-supplier],[data-act],[data-pfilter],[data-afilter],[data-review],[data-reopen],[data-rmphoto],[data-rmline],[data-askdel],[data-del]');
  if(!t)return;
  if(t.dataset.drvcheck){drvCheck(t.dataset.drvcheck);return}
  if(t.dataset.drvretry){try{await api('/api/drive',{method:'POST',body:{action:'retry',fileId:t.dataset.drvretry}});await drvLoad();drvSync(false)}catch(e){toast(e.message)}return}
  if(t.dataset.drvignore){try{await api('/api/drive',{method:'POST',body:{action:'ignore',fileId:t.dataset.drvignore}});drvLoad()}catch(e){toast(e.message)}return}
  if(t.dataset.impf){IMP.filter=t.dataset.impf;render();return}
  if(t.dataset.impcheck){impCheck(t.dataset.impcheck);return}
  if(t.dataset.impretry){const it=IMP.items.find(x=>x.key===t.dataset.impretry);if(it){it.status='waiting';it.msg='';render()}return}
  if(t.dataset.go){closeSheet();if(location.hash==='#'+t.dataset.go)render();else location.hash=t.dataset.go;window.scrollTo({top:0});return}
  if(t.dataset.product){showProduct(t.dataset.product);return}
  if(t.dataset.invoice){showInvoice(t.dataset.invoice);return}
  if(t.dataset.supplier){showSupplier(t.dataset.supplier);return}
  if(t.dataset.pfilter){UI.pfilter=t.dataset.pfilter;render();return}
  if(t.dataset.afilter){UI.afilter=t.dataset.afilter;render();return}
  if(t.dataset.review){if(!isOwner()){toast('Only the owner can review alerts.');return}try{await api('/api/alerts',{method:'PATCH',body:{id:t.dataset.review,status:'reviewed'}});toast('Marked as reviewed.');load()}catch(e){toast(e.message)}return}
  if(t.dataset.reopen){try{await api('/api/alerts',{method:'PATCH',body:{id:t.dataset.reopen,status:'open'}});toast('Alert reopened.');load()}catch(e){toast(e.message)}return}
  if(t.dataset.rmphoto!=null){const p=scan.photos.splice(+t.dataset.rmphoto,1)[0];if(p)URL.revokeObjectURL(p.url);render();return}
  if(t.dataset.rmline!=null){scan.draft.lines.splice(+t.dataset.rmline,1);lastView=null;render();return}
  if(t.dataset.askdel){$('#delWrap').innerHTML=`<div class="banner alert" style="width:100%;margin:0"><div class="grow">Delete this invoice? Its prices and alerts are removed too.</div><button class="btn sm danger" data-del="${esc(t.dataset.askdel)}">Delete</button><button class="btn sm" data-act="close">Keep</button></div>`;return}
  if(t.dataset.del){deleteInvoice(t.dataset.del);return}
  const a=t.dataset.act;
  if(a==='close')closeSheet();
  else if(a==='read')readInvoice();
  else if(a==='cancelRead'){if(readAbort)readAbort.cancelled=true;scan.step='capture';render()}
  else if(a==='manual')startManual();
  else if(a==='manualKeep'){const keep=scan.photos;startManual();scan.photos=keep;lastView=null;render()}
  else if(a==='pasteToggle'){UI.paste=!UI.paste;lastView=null;render();if(UI.paste)setTimeout(()=>$('#pasteText')?.focus(),30)}
  else if(a==='pasteAdd'){const rows=parsePaste($('#pasteText')?.value);if(!rows.length){toast('No product rows found. Each row needs a name and a price.');return}scan.draft.lines=scan.draft.lines.filter(l=>l.name.trim()||num(l.price)).concat(rows);UI.paste=false;lastView=null;render();toast(`${rows.length} line${rows.length>1?'s':''} added. Check them before saving.`)}
  else if(a==='loadSup'){const rows=supplierProductLines(scan.draft.supplierId);const have=new Set(scan.draft.lines.map(l=>norm(l.name)));scan.draft.lines=scan.draft.lines.filter(l=>l.name.trim()).concat(rows.filter(r=>!have.has(norm(r.name))));lastView=null;render();toast('Fill in the quantities. Change any price that is different.')}
  else if(a==='resetScan'){if(scan.importKey||scan.driveFileId){scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};location.hash='import';return}scan.photos.forEach(p=>URL.revokeObjectURL(p.url));scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'ai'};lastView=null;render()}
  else if(a==='addLine'){scan.draft.lines.push({name:'',unit:'',qty:'1',price:''});lastView=null;render();const ins=document.querySelectorAll('#dLines input[data-lf="name"]');ins[ins.length-1]?.focus()}
  else if(a==='save')saveInvoice();
  else if(a==='saveSettings'){try{const r=await api('/api/settings',{method:'PUT',body:{threshold:num($('#setThr').value),restaurant:$('#setRest').value.trim(),alertEmail:$('#setEmail').value.trim()}});S.settings={...S.settings,...r.settings};toast('Settings saved.');render()}catch(e){toast(e.message)}}
  else if(a==='savePins'){const o=$('#newOwnerPin').value.trim(),m=$('#newMgrPin').value.trim();if(!o&&!m){toast('Type a new PIN first.');return}try{await api('/api/session',{method:'POST',body:{action:'pins',ownerPin:o||undefined,managerPin:m||undefined}});S.settings.pinsEnabled=true;toast('PIN sign-in is on. Tell your managers the manager PIN.');render();$('#newOwnerPin').value='';$('#newMgrPin').value=''}catch(e){toast(e.message)}}
  else if(a==='signout')signOut();
  else if(a==='impStart')impRun();
  else if(a==='drvConnect'){UI.drvLink=$('#drvLink').value.trim();DRV.busy=true;DRV.note='';render();try{const r=await api('/api/drive',{method:'POST',body:{action:'connect',link:UI.drvLink,importExisting:$('#drvExisting')?.checked!==false}});DRV.st=r.status;DRV.busy=false;toast(`Connected. ${r.files} file${r.files===1?'':'s'} found in the folder.`);if(r.files&&$('#drvExisting')?.checked!==false)drvSync(true);else render()}catch(e){DRV.busy=false;DRV.note=e.message;render()}}
  else if(a==='drvSyncAll'){DRV.lastAuto=Date.now();drvSync(true)}
  else if(a==='drvStop'){DRV.stop=true;DRV.note='Pausing after the current invoice…';render()}
  else if(a==='drvDisconnect'){try{await api('/api/drive',{method:'POST',body:{action:'disconnect'}});DRV.st=null;drvLoad();toast('Folder disconnected.')}catch(e){toast(e.message)}}
  else if(a==='impPause'){IMP.stop=true;IMP.note='Pausing after the current invoice…';render()}
  else if(a==='impClear'){IMP.items=[];IMP.note='';render()}
  else if(a==='csv')downloadCsv();
  else if(a==='print')window.print();
  else if(a==='newPricelist'||a==='addTo'){scan.photos.forEach(p=>URL.revokeObjectURL(p.url));scan={step:'capture',photos:[],draft:null,error:'',result:null,source:'manual',kind:'pricelist',supplierId:t.dataset.sup||'new'};lastView=null;if(location.hash==='#scan')render();else location.hash='scan';window.scrollTo({top:0})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('#dLines input')){
    e.preventDefault();
    const line=e.target.closest('.line'),f=e.target.dataset.lf,order=['name','qty','unit','price'];
    if(f==='price'){const i=+line.dataset.line;if(i===scan.draft.lines.length-1){scan.draft.lines.push({name:'',unit:'',qty:'1',price:''});lastView=null;render()}const ins=document.querySelectorAll('#dLines input[data-lf="name"]');ins[i+1]?.focus();return}
    line.querySelector(`[data-lf="${order[order.indexOf(f)+1]}"]`)?.focus();return;
  }
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.matches('tr[data-product]'))showProduct(e.target.dataset.product);
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.photo){addPhotos([...t.files]);t.value='';return}
  if(t.dataset.imp){impAdd(t.files);t.value='';return}
  if(t.id==='psup'){UI.psup=t.value;render()}
  if(t.id==='lsup'){UI.lsup=t.value;render()}
  if(t.id==='psort'){UI.psort=t.value;render()}
  if(t.id==='isup'){UI.isup=t.value;render()}
  if(t.id==='dSup'){scan.draft.supplierId=t.value;lastView=null;render()}
  if(t.dataset&&t.dataset.lf==='name'){fillFromKnown(+t.closest('.line').dataset.line)}
  if(t.id==='dDate'){scan.draft.date=t.value;refreshCmp()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){UI.pq=t.value;render()}
  if(t.id==='lq'){UI.lq=t.value;render()}
  if(t.id==='drvLink')UI.drvLink=t.value;
  if(t.id==='iq'){UI.iq=t.value;render()}
  if(t.id==='cq'){UI.cq=t.value;render()}
  if(t.id==='dNum'){scan.draft.number=t.value;scan.draft.dupOk=false}
  if(t.id==='dNewSup')scan.draft.newSupplier=t.value;
  if(t.dataset.lf){const i=+t.closest('.line').dataset.line;scan.draft.lines[i][t.dataset.lf]=t.value;refreshCmp()}
});
window.addEventListener('hashchange',()=>{closeSheet();lastView=null;render()});
boot();
})();
</script>
</body>
</html>
